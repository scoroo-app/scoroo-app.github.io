<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoroo · Le compteur de points de vos soirées jeux</title>
<meta name="description" content="Scoroo compte les points de tous vos jeux : belote, tarot, Yams, Skyjo, 7 Wonders, fléchettes… Jeux créés et partagés, amis, jeu à plusieurs téléphones, tournois.">
<!--
  Site de Scoroo (https://scoroo-app.github.io), en cinq langues (fr, en, es, de, it) : textes dans
  I18N ci-dessous, langue du navigateur par défaut, sélecteur en haut de page. Captures dans img/
  (<langue>_<n>_<écran>.webp, tirées de store/screenshots/<langue>/web_*.png), vidéo dans video/
  (store/video/scoroo_play_<langue>.mp4). Couleurs des jeux : celles de lib/models/game_type.dart.
-->
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=block">
<style>
  :root {
    --ink: #13233a; --muted: #5b6476; --bg: #fbf8f1; --card: #ffffff; --line: #ebe5d8; --soft: #f3efe6;
    --navy: #0b3a6e; --navy-2: #0e2a4d; --gold: #ffaa0a; --teal: #0ea5a4; --pink: #e5486a;
    --display: 'Bricolage Grotesque', system-ui, sans-serif; --body: 'Figtree', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; font-size: 16.5px; }
  a { color: var(--navy); }
  img, video { max-width: 100%; display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; line-height: 1.08; margin: 0; }
  h2 { font-size: clamp(30px, 4.6vw, 44px); font-weight: 800; }
  h3 { font-size: 21px; font-weight: 700; }
  .eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin-bottom: 10px; display: block; }
  .lead { font-size: 18.5px; color: var(--muted); max-width: 40em; margin: 14px 0 0; }
  section { padding: 84px 0; }

  /* Barre du haut */
  .top { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .top .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { width: 36px; height: 36px; }
  .brand span { font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: -0.5px; }
  .nav { display: flex; gap: 18px; margin-left: auto; }
  .nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
  .nav a:hover { color: var(--ink); }
  select.lang { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
  @media (max-width: 860px) { .nav { display: none; } select.lang { margin-left: auto; } }

  /* En-tête */
  .hero { background: radial-gradient(1200px 500px at 85% -10%, #2b5fa0 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #0e7f86 0%, transparent 55%), linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; overflow: hidden; position: relative; padding: 72px 0 0; }
  .hero::before { content: ''; position: absolute; inset: 0; opacity: .08;
    background-image: radial-gradient(circle at 1px 1px, #fff 1.4px, transparent 0); background-size: 26px 26px; }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: end; }
  .hero h1 { font-size: clamp(40px, 6.4vw, 68px); font-weight: 800; letter-spacing: -0.035em; margin-top: 8px; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, #ffd166, #ffaa0a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .lead { color: rgba(255,255,255,.82); }
  .hero .badge { display: inline-flex; gap: 8px; align-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0 14px; }
  .store { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 16px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); transition: transform .15s; }
  .store:hover { transform: translateY(-2px); }
  .store .ms { font-size: 26px; }
  .store small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .hero .note { color: rgba(255,255,255,.7); font-size: 14.5px; margin-bottom: 64px; }
  .phones { position: relative; height: 560px; }
  /* Captures des stores (accroche et téléphone déjà dessinés) : en cartes arrondies. */
  .phone { position: absolute; width: 280px; border-radius: 28px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); }
  .phone img { border-radius: 28px; }
  .phone.a { left: 10px; bottom: -80px; transform: rotate(-7deg); }
  .phone.b { right: 0; bottom: -40px; transform: rotate(5deg); z-index: 1; }
  @media (max-width: 860px) {
    .hero .wrap { grid-template-columns: 1fr; }
    .phones { height: 420px; }
    .phone { width: 210px; } .phone.a { left: 4%; } .phone.b { right: 4%; }
  }

  /* Chiffres */
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: -1px; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; }
  .fact b { font-family: var(--display); font-size: 30px; display: block; letter-spacing: -0.03em; }
  .fact span { color: var(--muted); font-size: 14.5px; }
  @media (max-width: 760px) { .facts { grid-template-columns: repeat(2, 1fr); } }

  /* Vidéo */
  .video { border-radius: 26px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(11,58,110,.45); margin-top: 32px; background: #0e1726; aspect-ratio: 16/9; }
  .video video { width: 100%; height: 100%; object-fit: cover; }

  /* Jeux */
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 34px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .game:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -24px var(--c); }
  .game::after { content: ''; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: var(--c); opacity: .09; }
  .game .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, white); color: var(--c); margin-bottom: 12px; }
  .game .ic .ms { font-size: 30px; }
  .game h3 { font-size: 19px; }
  .game p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .game .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .game .tags span { font-size: 12.5px; font-weight: 600; background: var(--soft); border-radius: 999px; padding: 3px 9px; color: var(--ink); }

  /* Blocs de fonction (texte + capture) */
  .feature { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
  .feature.rev .shot { order: -1; }
  .feature .shot { display: flex; justify-content: center; }
  .feature .shot .phone { position: static; transform: rotate(-3deg); width: 290px; }
  .feature.rev .shot .phone { transform: rotate(3deg); }
  @media (max-width: 860px) { .feature { grid-template-columns: 1fr; gap: 36px; } .feature.rev .shot { order: 0; } }
  .points { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
  .points li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .points .ms { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--c, var(--navy)); background: color-mix(in srgb, var(--c, var(--navy)) 12%, white); }
  .points b { display: block; font-weight: 700; }
  .points span { color: var(--muted); font-size: 15.5px; }

  .band { background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; counter-reset: step; }
  .step { background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 22px; position: relative; }
  .step::before { counter-increment: step; content: counter(step); font-family: var(--display); font-weight: 800; font-size: 15px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--navy)); color: #fff; margin-bottom: 12px; }
  .step p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 860px) { .steps { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chips span { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chips .ms { font-size: 18px; color: var(--c, var(--navy)); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  .tile .ms { font-size: 30px; color: var(--c, var(--navy)); }
  .tile h3 { margin-top: 10px; font-size: 19px; }
  .tile p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 860px) { .grid3 { grid-template-columns: 1fr; } }

  /* Gratuit / version complète */
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
  .plan { border-radius: 26px; padding: 28px; border: 1px solid var(--line); background: var(--card); }
  .plan.full { background: linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; border: 0; }
  .plan h3 { font-size: 24px; }
  .plan .price { font-family: var(--display); font-size: 40px; font-weight: 800; margin: 8px 0 4px; }
  .plan .price small { font-size: 16px; font-weight: 600; opacity: .75; }
  .plan ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
  .plan li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
  .plan li .ms { font-size: 20px; color: var(--teal); }
  .plan.full li .ms { color: var(--gold); }
  .plan.full .muted { color: rgba(255,255,255,.75); }
  @media (max-width: 760px) { .plans { grid-template-columns: 1fr; } }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; margin-top: 10px; }
  summary { cursor: pointer; font-weight: 700; font-size: 16.5px; }
  details p { color: var(--muted); margin: 10px 0 0; }

  .cta { text-align: center; background: radial-gradient(800px 400px at 50% 0%, #2b5fa0, transparent 70%), linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; border-radius: 34px; padding: 64px 24px; }
  .cta .stores { justify-content: center; }
  footer { padding: 36px 0 48px; color: var(--muted); font-size: 14.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
  footer a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><img src="img/logo.png" alt=""><span>Scoroo</span></a>
    <nav class="nav">
      <a href="#jeux" data-i18n="navGames"></a>
      <a href="#creer" data-i18n="navCreate"></a>
      <a href="#amis" data-i18n="navFriends"></a>
      <a href="#tournois" data-i18n="navCups"></a>
      <a href="#prix" data-i18n="navPrice"></a>
    </nav>
    <select class="lang" id="lang" aria-label="Language">
      <option value="fr">Français</option><option value="en">English</option><option value="es">Español</option>
      <option value="de">Deutsch</option><option value="it">Italiano</option>
    </select>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <span class="badge"><span class="ms">bolt</span><span data-i18n="heroBadge"></span></span>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="stores" data-stores></div>
      <p class="note" data-i18n="heroNote"></p>
    </div>
    <div class="phones">
      <div class="phone a"><img data-shot="2_tarot" alt=""></div>
      <div class="phone b"><img data-shot="1_accueil" alt=""></div>
    </div>
  </div>
</section>

<section style="padding-top: 28px">
  <div class="wrap">
    <div class="facts">
      <div class="fact"><b>13</b><span data-i18n="factGames"></span></div>
      <div class="fact"><b>5</b><span data-i18n="factLangs"></span></div>
      <div class="fact"><b>0 €</b><span data-i18n="factFree"></span></div>
      <div class="fact"><b>100 %</b><span data-i18n="factLocal"></span></div>
    </div>
    <div class="video">
      <video data-video autoplay muted loop playsinline preload="metadata"></video>
    </div>
  </div>
</section>

<section id="jeux" style="padding-top: 40px">
  <div class="wrap">
    <span class="eyebrow" data-i18n="gamesEyebrow"></span>
    <h2 data-i18n="gamesTitle"></h2>
    <p class="lead" data-i18n="gamesLead"></p>
    <div class="games" id="games"></div>
  </div>
</section>

<section class="band">
  <div class="wrap feature">
    <div>
      <span class="eyebrow" data-i18n="playEyebrow"></span>
      <h2 data-i18n="playTitle"></h2>
      <p class="lead" data-i18n="playLead"></p>
      <ul class="points" data-points="play"></ul>
    </div>
    <div class="shot"><div class="phone"><img data-shot="3_victoire" alt=""></div></div>
  </div>
</section>

<section id="creer">
  <div class="wrap feature rev">
    <div>
      <span class="eyebrow" data-i18n="createEyebrow"></span>
      <h2 data-i18n="createTitle"></h2>
      <p class="lead" data-i18n="createLead"></p>
      <ul class="points" data-points="create" style="--c: #7b61ff"></ul>
    </div>
    <div class="shot"><div class="phone"><img data-shot="5_yams" alt=""></div></div>
  </div>
  <div class="wrap">
    <h3 style="margin-top: 56px" data-i18n="shareTitle"></h3>
    <p class="lead" data-i18n="shareLead"></p>
    <div class="steps" data-steps="share" style="--c: #7b61ff"></div>
    <div class="chips" data-chips="sheet" style="--c: #7b61ff"></div>
  </div>
</section>

<section id="amis" class="band">
  <div class="wrap">
    <span class="eyebrow" data-i18n="friendsEyebrow"></span>
    <h2 data-i18n="friendsTitle"></h2>
    <p class="lead" data-i18n="friendsLead"></p>
    <div class="steps" data-steps="friends" style="--c: #0ea5a4"></div>
  </div>
  <div class="wrap feature" style="margin-top: 56px">
    <div>
      <h3 data-i18n="onlineTitle"></h3>
      <p class="lead" data-i18n="onlineLead"></p>
      <ul class="points" data-points="online" style="--c: #e5486a"></ul>
    </div>
    <div class="shot"><div class="phone"><img data-shot="6_stats" alt=""></div></div>
  </div>
</section>

<section id="tournois">
  <div class="wrap feature rev">
    <div>
      <span class="eyebrow" data-i18n="cupsEyebrow"></span>
      <h2 data-i18n="cupsTitle"></h2>
      <p class="lead" data-i18n="cupsLead"></p>
      <ul class="points" data-points="cups" style="--c: #e8590c"></ul>
      <div class="chips" data-chips="formats" style="--c: #e8590c"></div>
    </div>
    <div class="shot"><div class="phone"><img data-shot="7_tv" alt=""></div></div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <span class="eyebrow" data-i18n="moreEyebrow"></span>
    <h2 data-i18n="moreTitle"></h2>
    <div class="grid3" data-tiles="more"></div>
  </div>
</section>

<section id="prix">
  <div class="wrap">
    <span class="eyebrow" data-i18n="priceEyebrow"></span>
    <h2 data-i18n="priceTitle"></h2>
    <p class="lead" data-i18n="priceLead"></p>
    <div class="plans">
      <div class="plan">
        <h3 data-i18n="freeTitle"></h3>
        <div class="price">0 €</div>
        <p class="muted" data-i18n="freeLead"></p>
        <ul data-list="free"></ul>
      </div>
      <div class="plan full">
        <h3 data-i18n="fullTitle"></h3>
        <div class="price">7,99 € <small data-i18n="fullOnce"></small></div>
        <p class="muted" data-i18n="fullLead"></p>
        <ul data-list="full"></ul>
      </div>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <span class="eyebrow" data-i18n="faqEyebrow"></span>
    <h2 data-i18n="faqTitle"></h2>
    <div data-faq style="margin-top: 24px"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="cta">
      <h2 data-i18n="ctaTitle"></h2>
      <p class="lead" style="color: rgba(255,255,255,.8); margin-left: auto; margin-right: auto" data-i18n="ctaLead"></p>
      <div class="stores" data-stores></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© Scoroo</span>
    <a href="privacy.html" data-i18n="privacy"></a>
    <a href="mailto:scoroo.app@gmail.com">scoroo.app@gmail.com</a>
    <span data-i18n="madeIn"></span>
  </div>
</footer>

  const I18N = {

  const $$ = (s) => document.querySelectorAll(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);

  function render(lang) {
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    $$('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
    $$('[data-i18n-html]').forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
    $$('[data-shot]').forEach((img) => { img.src = `img/${lang}_${img.dataset.shot}.webp`; });
    const video = document.querySelector('[data-video]');
    const src = `video/scoroo_${lang === 'fr' ? 'fr' : 'en'}.mp4`;
    if (!video.src.endsWith(src)) { video.src = src; video.play().catch(() => {}); }
    // Boutons des stores : celui du téléphone d'abord.
    const play = `<a class="store" href="${PLAY}"><span class="ms">shop</span><span><small>${esc(t.storeGet)}</small>Google Play</span></a>`;
    const apple = `<a class="store" href="${APPLE}"><span class="ms">phone_iphone</span><span><small>${esc(t.storeApple)}</small>App Store</span></a>`;
    $$('[data-stores]').forEach((el) => { el.innerHTML = ios ? apple + play : android ? play + apple : play + apple; });
    document.getElementById('games').innerHTML = GAMES.map((g) => {
      const [name, desc, tags] = t.g[g.id];
      return `<article class="game" style="--c:${g.c}"><div class="ic"><span class="ms">${g.icon}</span></div>` +
        `<h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="tags">${tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div></article>`;
    }).join('');
    $$('[data-points]').forEach((el) => {
      el.innerHTML = t.points[el.dataset.points].map(([icon, title, text]) =>
        `<li><span class="ms">${icon}</span><div><b>${esc(title)}</b><span>${esc(text)}</span></div></li>`).join('');
    });
    $$('[data-steps]').forEach((el) => {
      el.innerHTML = t.steps[el.dataset.steps].map(([title, text]) => `<div class="step"><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('');
    });
    $$('[data-chips]').forEach((el) => {
      el.innerHTML = t.chips[el.dataset.chips].map(([icon, label]) => `<span><span class="ms">${icon}</span>${esc(label)}</span>`).join('');
    });
    $$('[data-tiles]').forEach((el) => {
      el.innerHTML = t.tiles[el.dataset.tiles].map(([icon, title, text]) =>
        `<div class="tile"><span class="ms">${icon}</span><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('');
    });
    $$('[data-list]').forEach((el) => {
      el.innerHTML = t.list[el.dataset.list].map((x) => `<li><span class="ms">check_circle</span><span>${esc(x)}</span></li>`).join('');
    });
    document.querySelector('[data-faq]').innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
    document.getElementById('lang').value = lang;
  }

  const saved = (() => { try { return localStorage.getItem('scoroo-lang'); } catch (e) { return null; } })();
  const browser = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  const initial = LANGS.includes(saved) ? saved : (LANGS.includes(browser) ? browser : 'en');
  document.getElementById('lang').addEventListener('change', (e) => {
    try { localStorage.setItem('scoroo-lang', e.target.value); } catch (err) {}
    render(e.target.value);
  });
  render(initial);
</script>
