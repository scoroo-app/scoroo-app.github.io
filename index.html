<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoroo · Le compteur de points de vos soirées jeux</title>
<meta name="description" content="Scoroo compte les points de tous vos jeux : belote, tarot, Yams, Skyjo, 7 Wonders, fléchettes… Jeux créés et partagés, amis, jeu à plusieurs téléphones, tournois.">
<!--
  Site de Scoroo (https://scoroo-app.github.io), en cinq langues (fr, en, es, de, it) : textes dans
  I18N ci-dessous, langue du navigateur par défaut, sélecteur en haut de page. Captures dans img/
  (<langue>_<n>_<écran>.webp, tirées de store/screenshots/<langue>/web_*.png ; télé seule :
  <langue>_tv_<nom>.webp), vidéo dans video/ (store/video/scoroo_play_<langue>.mp4, avec son image
  d'attente scoroo_<langue>.webp).
  Couleurs des jeux : celles de lib/models/game_type.dart. Vérification : node tool/site_check.mjs.
-->
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=block">
<style>
  :root {
    --ink: #13233a; --muted: #5b6476; --bg: #fbf8f1; --card: #ffffff; --line: #ebe5d8; --soft: #f3efe6;
    --navy: #0b3a6e; --navy-2: #0e2a4d; --gold: #ffaa0a; --teal: #0ea5a4; --pink: #e5486a;
    --display: 'Bricolage Grotesque', system-ui, sans-serif; --body: 'Figtree', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; font-size: 16.5px; }
  a { color: var(--navy); }
  img, video { max-width: 100%; display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; line-height: 1.08; margin: 0; }
  h2 { font-size: clamp(30px, 4.6vw, 44px); font-weight: 800; }
  h3 { font-size: 21px; font-weight: 700; }
  .eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin-bottom: 10px; display: block; }
  .lead { font-size: 18.5px; color: var(--muted); max-width: 40em; margin: 14px 0 0; }
  section { padding: 84px 0; }

  /* Barre du haut */
  .top { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .top .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { width: 36px; height: 36px; }
  .brand span { font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: -0.5px; }
  .nav { display: flex; gap: 18px; margin-left: auto; }
  .nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
  .nav a:hover { color: var(--ink); }
  select.lang { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
  @media (max-width: 860px) { .nav { display: none; } select.lang { margin-left: auto; } }

  /* En-tête */
  .hero { background: radial-gradient(1200px 500px at 85% -10%, #2b5fa0 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #0e7f86 0%, transparent 55%), linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; overflow: hidden; position: relative; padding: 72px 0 0; }
  .hero::before { content: ''; position: absolute; inset: 0; opacity: .08;
    background-image: radial-gradient(circle at 1px 1px, #fff 1.4px, transparent 0); background-size: 26px 26px; }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: end; }
  .hero h1 { font-size: clamp(40px, 6.4vw, 68px); font-weight: 800; letter-spacing: -0.035em; margin-top: 8px; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, #ffd166, #ffaa0a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .lead { color: rgba(255,255,255,.82); }
  .hero .badge { display: inline-flex; gap: 8px; align-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0 14px; }
  .store { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 16px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); transition: transform .15s; }
  .store:hover { transform: translateY(-2px); }
  .store .ms { font-size: 26px; }
  .store .logo { width: 26px; height: 26px; flex: none; }
  .store small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .hero .note { color: rgba(255,255,255,.7); font-size: 14.5px; margin-bottom: 64px; }
  .phones { position: relative; height: 560px; }
  /* Captures des stores (accroche et téléphone déjà dessinés) : en cartes arrondies. */
  .phone { position: absolute; width: 280px; border-radius: 28px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); }
  .phone img { border-radius: 28px; }
  .phone.a { left: 10px; bottom: -80px; transform: rotate(-7deg); }
  .phone.b { right: 0; bottom: -40px; transform: rotate(5deg); z-index: 1; }
  @media (max-width: 860px) {
    .hero .wrap { grid-template-columns: 1fr; }
    .phones { height: 420px; }
    .phone { width: 210px; } .phone.a { left: 4%; } .phone.b { right: 4%; }
  }

  /* Chiffres */
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: -1px; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; display: grid; grid-template-columns: 46px 1fr; gap: 0 14px; align-items: center;
    box-shadow: 0 14px 30px -26px rgba(11,58,110,.5); }
  .fact .ms { grid-row: span 2; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); }
  .fact b { font-family: var(--display); font-size: 30px; display: block; letter-spacing: -0.03em; line-height: 1.1; }
  .fact span { color: var(--muted); font-size: 14.5px; }
  .fact b { white-space: nowrap; }
  @media (max-width: 760px) {
    .facts { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fact { grid-template-columns: 1fr; padding: 16px; }
    .fact .ms { grid-row: auto; width: 38px; height: 38px; font-size: 22px; border-radius: 12px; margin-bottom: 10px; }
  }

  /* Vidéo */
  .video { border-radius: 26px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(11,58,110,.45); margin-top: 32px; background: #0e1726; aspect-ratio: 16/9; }
  .video video { width: 100%; height: 100%; object-fit: cover; }

  /* Jeux */
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 34px; }
  /* Carte d'un jeu : liseré de sa couleur en haut, léger dégradé, pictogramme en relief. */
  .game { background: linear-gradient(170deg, color-mix(in srgb, var(--c) 8%, var(--card)) 0%, var(--card) 60%);
    border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px 18px; position: relative; overflow: hidden;
    transition: transform .15s, box-shadow .15s, border-color .15s; }
  .game::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 40%, white)); }
  .game:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); box-shadow: 0 18px 40px -24px var(--c); }
  .game .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; margin-bottom: 14px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c) 75%, white), var(--c));
    box-shadow: 0 8px 18px -8px var(--c); }
  .game .ic .ms { font-size: 30px; }
  .game h3 { font-size: 19px; }
  .game p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .game .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .game .tags span { font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--c) 10%, white); border-radius: 999px; padding: 3px 9px;
    color: color-mix(in srgb, var(--c) 70%, var(--ink)); }

  /* Blocs de fonction (texte + capture) */
  .feature { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
  .feature.rev .shot { order: -1; }
  .feature .shot { display: flex; justify-content: center; }
  .feature .shot .phone { position: static; transform: rotate(-3deg); width: 290px; }
  /* Tournois : trois écrans côte à côte sur toute la largeur, celui du milieu un peu plus haut. */
  .fan { display: grid; grid-template-columns: repeat(3, minmax(0, 340px)); justify-content: center; gap: 28px;
    margin-top: 44px; align-items: start; }
  .fan .phone { position: static; width: auto; border-radius: 26px; transition: transform .25s; }
  .fan .phone img { border-radius: 26px; display: block; width: 100%; }
  .fan .phone:nth-child(1) { transform: rotate(-3deg) translateY(28px); }
  .fan .phone:nth-child(3) { transform: rotate(3deg) translateY(28px); }
  .fan .phone:hover { transform: translateY(-8px); z-index: 2; }
  @media (max-width: 760px) {
    /* Téléphone : les écrans défilent de côté, un peu plus grands que la moitié de l'écran. */
    .fan { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding: 10px 4px 24px; margin-top: 28px; justify-content: flex-start; }
    .fan .phone, .fan .phone:nth-child(1), .fan .phone:nth-child(3) { flex: 0 0 72%; transform: none; scroll-snap-align: center; }
  }

  .feature.rev .shot .phone { transform: rotate(3deg); }
  @media (max-width: 860px) { .feature { grid-template-columns: 1fr; gap: 36px; } .feature.rev .shot { order: 0; } }
  .points { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
  .points li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .points .ms { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--c, var(--navy)); background: color-mix(in srgb, var(--c, var(--navy)) 12%, white); }
  .points b { display: block; font-weight: 700; }
  .points span { color: var(--muted); font-size: 15.5px; }

  .band { background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; counter-reset: step; }
  .step { background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 22px; position: relative; }
  .step::before { counter-increment: step; content: counter(step); font-family: var(--display); font-weight: 800; font-size: 15px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--navy)); color: #fff; margin-bottom: 12px; }
  .step p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 860px) { .steps { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chips > span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px 6px 10px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chips .ms { font-size: 18px; color: var(--c, var(--navy)); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  .tile .ms { font-size: 30px; color: var(--c, var(--navy)); }
  .tile h3 { margin-top: 10px; font-size: 19px; }
  .tile p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 860px) { .grid3 { grid-template-columns: 1fr; } }

  /* Gratuit / version complète */
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
  .plan { border-radius: 26px; padding: 28px; border: 1px solid var(--line); background: var(--card); }
  .plan.full { background: linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; border: 0; }
  .plan h3 { font-size: 24px; }
  .plan .price { font-family: var(--display); font-size: 40px; font-weight: 800; margin: 8px 0 4px; }
  .plan .price small { font-size: 16px; font-weight: 600; opacity: .75; }
  .plan ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
  .plan li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
  .plan li .ms { font-size: 20px; color: var(--teal); }
  .plan.full li .ms { color: var(--gold); }
  .plan.full .muted { color: rgba(255,255,255,.75); }
  @media (max-width: 760px) { .plans { grid-template-columns: 1fr; } }

  .plan.full { position: relative; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(11,58,110,.7); }
  .plan.full::after { content: ''; position: absolute; width: 320px; height: 320px; right: -120px; top: -140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,170,10,.28), transparent 70%); pointer-events: none; }

  /* Mode TV : la télé dessinée, trois écrans en onglets. */
  .tvsec { background: radial-gradient(900px 480px at 80% 0%, #24518c 0%, transparent 60%), linear-gradient(170deg, #0e1f38, #0b1424); color: #fff; overflow: hidden; }
  .tvsec .lead { color: rgba(255,255,255,.78); }
  .tvsec .eyebrow { color: #5eead4; }
  .tvgrid { display: grid; grid-template-columns: 1.35fr .65fr; gap: 48px; align-items: center; margin-top: 40px; }
  .tv { position: relative; }
  .tv .screen { background: #050608; border-radius: 18px; padding: 10px; box-shadow: 0 50px 90px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06); }
  .tv .frames { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #0e1726; }
  .tv .frames img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
  .tv .frames img.on { opacity: 1; }
  .tv .stand { width: 26%; height: 14px; margin: 0 auto; background: linear-gradient(#1b2230, #0b0f16); border-radius: 0 0 10px 10px; }
  .tv .glow { position: absolute; inset: 10% 5% -8%; background: radial-gradient(closest-side, rgba(94,234,212,.18), transparent); filter: blur(30px); z-index: -1; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .tabs button { font: inherit; font-weight: 700; font-size: 14.5px; color: rgba(255,255,255,.75); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: background .2s, color .2s; }
  .tabs button.on { background: #fff; color: var(--navy-2); border-color: #fff; }
  .tvsec .points .ms { color: #5eead4; background: rgba(94,234,212,.12); }
  .tvsec .points span { color: rgba(255,255,255,.72); }
  @media (max-width: 960px) { .tvgrid { grid-template-columns: 1fr; gap: 36px; } }

  /* En images : captures qui défilent de côté. */
  .gallery { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; padding: 34px 20px 30px; margin: 0 auto; max-width: 1400px; scrollbar-width: thin; }
  .gallery img { flex: 0 0 210px; width: 210px; border-radius: 22px; scroll-snap-align: start; box-shadow: 0 30px 50px -30px rgba(11,58,110,.55); transition: transform .2s; }
  .gallery img:nth-child(even) { margin-top: 26px; }
  .gallery img:hover { transform: translateY(-6px); }
  @media (max-width: 760px) { .gallery img { flex-basis: 62vw; width: 62vw; } .gallery img:nth-child(even) { margin-top: 0; } }
  /* Assez large : les six écrans tiennent sur une ligne, centrés. */
  @media (min-width: 1400px) { .gallery { justify-content: center; } }

  .points.two { grid-template-columns: 1fr 1fr; gap: 18px 36px; }
  @media (max-width: 760px) { .points.two { grid-template-columns: 1fr; } }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; margin-top: 10px; }
  summary { cursor: pointer; font-weight: 700; font-size: 16.5px; }
  details p { color: var(--muted); margin: 10px 0 0; }

  .cta { text-align: center; background: radial-gradient(800px 400px at 50% 0%, #2b5fa0, transparent 70%), linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; border-radius: 34px; padding: 64px 24px; }
  .cta .stores { justify-content: center; }
  /* Réseaux sociaux : Instagram et TikTok de Scoroo. */
  .social { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .social a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; text-decoration: none;
    font-weight: 700; font-size: 15px; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); transition: background .15s; }
  .social a:hover { background: rgba(255,255,255,.22); }
  .social svg { width: 20px; height: 20px; flex: none; }
  .cta .follow { margin: 28px 0 0; color: rgba(255,255,255,.75); font-weight: 600; font-size: 15px; }
  footer .socials { display: inline-flex; gap: 12px; }
  footer .socials a { display: inline-flex; color: var(--muted); }
  footer .socials a:hover { color: var(--ink); }
  footer .socials svg { width: 22px; height: 22px; }
  .nav .ig { display: inline-flex; align-items: center; }
  .nav .ig svg { width: 20px; height: 20px; }
  footer { padding: 36px 0 48px; color: var(--muted); font-size: 14.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
  footer a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><img src="img/logo.png" alt=""><span>Scoroo</span></a>
    <nav class="nav">
      <a href="#jeux" data-i18n="navGames"></a>
      <a href="#creer" data-i18n="navCreate"></a>
      <a href="#amis" data-i18n="navFriends"></a>
      <a href="#tournois" data-i18n="navCups"></a>
      <a href="#tv" data-i18n="navTv"></a>
      <a href="#prix" data-i18n="navPrice"></a>
      <a class="ig" href="https://www.instagram.com/scoroo_app/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.8a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-8.4a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg></a>
      <a class="ig" href="https://www.tiktok.com/@scoroo_app" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.9 7.9 0 0 0 4.4 1.4V6.7a4.6 4.6 0 0 1-4.4-4.7z"/></svg></a>
    </nav>
    <select class="lang" id="lang" aria-label="Language">
      <option value="fr">Français</option><option value="en">English</option><option value="es">Español</option>
      <option value="de">Deutsch</option><option value="it">Italiano</option>
    </select>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <span class="badge"><span class="ms">bolt</span><span data-i18n="heroBadge"></span></span>

  const $$ = (s) => document.querySelectorAll(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);

  function render(lang) {
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    $$('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
    $$('[data-i18n-html]').forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
    $$('[data-shot]').forEach((img) => { img.src = `img/${lang}_${img.dataset.shot}.webp`; });
    const video = document.querySelector('[data-video]');
    const vlang = lang === 'fr' ? 'fr' : 'en';
    const src = `video/scoroo_${vlang}.mp4`;
    // Image de la vidéo affichée pendant son chargement (plus de cadre vide).
    if (!video.src.endsWith(src)) { video.poster = `video/scoroo_${vlang}.webp`; video.src = src; video.play().catch(() => {}); }
  // Logos des stores (pomme d'Apple, triangle de Google Play), dessinés en SVG.
  const APPLE_LOGO = '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.15 6.9c-.95 0-2.42-1.08-3.96-1.04-2.04.03-3.91 1.18-4.96 3.01-2.12 3.68-.55 9.1 1.52 12.09 1.01 1.45 2.2 3.09 3.79 3.04 1.52-.07 2.09-.99 3.93-.99 1.83 0 2.35.99 3.96.95 1.64-.03 2.68-1.48 3.68-2.95 1.16-1.69 1.63-3.32 1.66-3.41-.04-.02-3.18-1.22-3.22-4.86-.03-3.04 2.48-4.49 2.6-4.56-1.43-2.09-3.62-2.32-4.39-2.38-2-.15-3.68 1.09-4.61 1.09zm3.38-3.07c.84-1.01 1.4-2.43 1.25-3.83-1.21.05-2.66.81-3.53 1.82-.78.9-1.46 2.34-1.27 3.71 1.34.1 2.71-.69 3.56-1.7z"/></svg>';
  const PLAY_LOGO = '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00d7fe" d="M3.6 1.8 13.3 12l-9.7 10.2c-.3-.2-.5-.6-.5-1.1V2.9c0-.5.2-.9.5-1.1z"/><path fill="#00f076" d="M3.6 1.8c.3-.2.8-.2 1.3.1l11.7 6.8-3.3 3.3z"/><path fill="#ff3a44" d="M13.3 12l3.3 3.3-11.7 6.8c-.5.3-1 .3-1.3.1z"/><path fill="#ffd109" d="m16.6 8.7 3.4 2c.9.5.9 1.6 0 2.1l-3.4 2-3.3-2.8z"/></svg>';
    // Boutons des stores : celui du téléphone d'abord.
    const play = `<a class="store" href="${PLAY}">${PLAY_LOGO}<span><small>${esc(t.storeGet)}</small>Google Play</span></a>`;
    const apple = `<a class="store" href="${APPLE}">${APPLE_LOGO}<span><small>${esc(t.storeApple)}</small>App Store</span></a>`;
    $$('[data-stores]').forEach((el) => { el.innerHTML = ios ? apple + play : android ? play + apple : play + apple; });
    document.getElementById('games').innerHTML = GAMES.map((g) => {
      const [name, desc, tags] = t.g[g.id];
      return `<article class="game" style="--c:${g.c}"><div class="ic"><span class="ms">${g.icon}</span></div>` +
        `<h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="tags">${tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div></article>`;
    }).join('');
    // Télé : un onglet par écran, qui défilent tout seuls.
    document.querySelector('[data-tabs]').innerHTML = t.tvTabs.map((x, i) => `<button type="button" data-tab="${i}">${esc(x)}</button>`).join('');
    showTv(tvIndex);
    $$('[data-points]').forEach((el) => {
      el.innerHTML = (t.points[el.dataset.points] || t[el.dataset.points + 'Points']).map(([icon, title, text]) =>
        `<li><span class="ms">${icon}</span><div><b>${esc(title)}</b><span>${esc(text)}</span></div></li>`).join('');
    });
    $$('[data-steps]').forEach((el) => {
      el.innerHTML = t.steps[el.dataset.steps].map(([title, text]) => `<div class="step"><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('');
    });
    $$('[data-chips]').forEach((el) => {
      el.innerHTML = t.chips[el.dataset.chips].map(([icon, label]) => `<span><span class="ms">${icon}</span>${esc(label)}</span>`).join('');
    });
    $$('[data-tiles]').forEach((el) => {
      el.innerHTML = t.tiles[el.dataset.tiles].map(([icon, title, text]) =>
        `<div class="tile"><span class="ms">${icon}</span><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('');
    });
    $$('[data-list]').forEach((el) => {
      el.innerHTML = t.list[el.dataset.list].map((x) => `<li><span class="ms">check_circle</span><span>${esc(x)}</span></li>`).join('');
    });
    document.querySelector('[data-faq]').innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
    document.getElementById('lang').value = lang;
  }

  let tvIndex = 0;
  function showTv(i) {
    tvIndex = i;
    $$('.tv .frames img').forEach((img, n) => img.classList.toggle('on', n === i));
    $$('[data-tab]').forEach((b, n) => b.classList.toggle('on', n === i));
  }
  document.querySelector('[data-tabs]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    showTv(Number(b.dataset.tab));
    clearInterval(tvTimer); // l'utilisateur a choisi : on ne fait plus défiler
  });
  const tvTimer = setInterval(() => showTv((tvIndex + 1) % 3), 5000);

  const saved = (() => { try { return localStorage.getItem('scoroo-lang'); } catch (e) { return null; } })();
  const browser = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  const initial = LANGS.includes(saved) ? saved : (LANGS.includes(browser) ? browser : 'en');
  document.getElementById('lang').addEventListener('change', (e) => {
    try { localStorage.setItem('scoroo-lang', e.target.value); } catch (err) {}
    render(e.target.value);
  });
  render(initial);
</script>
