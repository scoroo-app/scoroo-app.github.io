<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoroo TV</title>
<!--
  Page réceptrice du Chromecast (mode TV de Scoroo).
  À enregistrer dans la Google Cast Developer Console comme « Custom Receiver », avec l'adresse
  publique de cette page. L'appli envoie le tableau des scores en JSON sur le canal
  urn:x-cast:com.scoroo.tv (format : lib/tv/tv_payload.dart).
  Ouverte dans un navigateur avec ?demo, elle affiche une partie d'exemple.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --bg: #0e1726; --row: rgba(255,255,255,.06); --muted: rgba(255,255,255,.6); --gold: #ffb534; --u: min(5vh, 2.8vw); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden;
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif; }
  .screen { position: absolute; inset: 0; padding: calc(var(--u) * .8) calc(var(--u) * 1.4); display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  /* Fond discret du jeu (backdrops/<jeu>.png, générés par tool/store_assets/tv_backdrops_test.dart). */
  #game { background: var(--bg) center / cover no-repeat; }
  /* Attente */
  .idle { align-items: center; justify-content: center; text-align: center; }
  .idle img { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 28%; }
  .idle h1 { font-size: calc(var(--u) * 2.6); font-weight: 900; margin: calc(var(--u) * .8) 0 calc(var(--u) * .3); letter-spacing: -.02em; }
  .idle p { font-size: calc(var(--u) * 1.05); color: var(--muted); margin: 0; }
  /* Partie */
  header { display: flex; align-items: center; gap: calc(var(--u) * .8); }
  .badge { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 30%; background: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: calc(var(--u) * .7); flex: none; }
  .badge img { width: 66%; height: 66%; }
  .titles { min-width: 0; }
  .title { font-size: calc(var(--u) * 1); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subtitle { font-size: calc(var(--u) * .6); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { flex: 1; display: flex; gap: calc(var(--u) * .8); margin: calc(var(--u) * .5) 0 calc(var(--u) * .4); min-height: 0; }
  .rows { position: relative; flex: 3; min-width: 0; }
  /* Repères (objectif, donneur, cartes) et historique des manches. */
  .info { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .4); margin-top: calc(var(--u) * .4); }
  .info:empty { display: none; }
  .pill { display: flex; align-items: center; gap: calc(var(--u) * .3); background: rgba(255,255,255,.1); border-radius: 999px;
    padding: calc(var(--u) * .2) calc(var(--u) * .55); font-weight: 700; font-size: calc(var(--u) * .7); }
  .pill i { font-style: normal; }
  .history { flex: 2; min-width: 0; background: rgba(255,255,255,.06); border-radius: calc(var(--u) * .8);
    padding: calc(var(--u) * .6); display: flex; flex-direction: column; overflow: hidden; }
  .history h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .75); }
  .hrow { display: flex; align-items: center; height: calc(var(--u) * 1.15); border-radius: calc(var(--u) * .3); flex: none; }
  .hrow.last { background: rgba(255,255,255,.08); }
  .hrow > * { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: calc(var(--u) * .62);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .hrow > :first-child { flex: none; width: calc(var(--u) * 1.4); color: rgba(255,255,255,.55); font-weight: 700; }
  .hrow .up { color: #7ee2a8; } .hrow .down { color: #ff9c9c; } .hrow .zero { color: rgba(255,255,255,.5); }
  .hhead { height: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * .2); }
  .hhead .avatar { margin: 0 auto; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); font-size: calc(var(--u) * .5); }
  .row { position: absolute; overflow: hidden; display: flex; align-items: center; background: var(--row);
    transition: top .5s cubic-bezier(.65,0,.35,1), background .4s; }
  /* Le premier garde le même fond gris que les autres : la couronne le distingue. */
  /* Tour par tour : la ligne de celui qui joue, cerclée de blanc, avec « À jouer ». */
  .row.turn { box-shadow: inset 0 0 0 3px #fff, 0 0 24px rgba(255,255,255,.25); }
  .row.turn { background: rgba(255,255,255,.14); }
  .rank { color: var(--muted); font-weight: 800; flex: none; }
  .avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 900; flex: none; }
  .name { flex: 1; min-width: 0; font-weight: 800; line-height: 1.1; }
  .name span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { display: block; color: rgba(255,255,255,.55); font-weight: 600; }
  .name .misses { display: flex; gap: 4px; margin-top: 2px; font-style: normal; }
  .name .misses:empty { display: none; }
  .name .misses b { display: block; border-radius: 50%; }
  .crown { color: var(--gold); transition: transform .6s cubic-bezier(.34,1.56,.64,1); transform: scale(0); }
  .leader .crown { transform: scale(1); }
  .delta { font-weight: 700; }
  .delta.up { color: #7ee2a8; } .delta.down { color: #ff9c9c; }
  .score { font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
  footer { display: flex; align-items: center; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .55); color: var(--muted); font-weight: 700; }
  footer img { width: calc(var(--u) * .95); height: calc(var(--u) * .95); border-radius: 30%; }
  footer .banner { margin-left: auto; color: var(--gold); font-weight: 900; font-size: calc(var(--u) * .95); }
  /* Grand tournoi : les tables à gauche, prochains matchs et classement à droite. */
  .cup-body { flex: 1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: calc(var(--u) * .8); margin-top: calc(var(--u) * .8); min-height: 0; }
  .cup-tables { display: grid; gap: calc(var(--u) * .4); align-content: start; min-height: 0; overflow: hidden; }
  .cup-table { min-width: 0; background: var(--row); border-radius: calc(var(--u) * .7); padding: calc(var(--u) * .5 * var(--s, 1)) calc(var(--u) * .8); display: grid; gap: calc(var(--u) * .2); }
  .cup-table b { color: var(--gold); font-size: calc(var(--u) * .7); }
  .cup-line { min-width: 0; display: flex; gap: calc(var(--u) * .5); align-items: center; font-weight: 700; font-size: calc(var(--u) * .9 * var(--s, 1)); }
  /* Nom d'une équipe : sur deux lignes s'il est long (équipes de quatre), jamais coupé au milieu d'une ligne. */
  .cup-line span:first-child { flex: 1; min-width: 0; overflow: hidden; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cup-line span:last-child { font-weight: 900; font-size: calc(var(--u) * 1.1 * var(--s, 1)); }
  .cup-panel { background: rgba(255,255,255,.05); border-radius: calc(var(--u) * .8); padding: calc(var(--u) * .8); overflow: hidden; }
  .cup-panel h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .8); }
  .cup-panel p { margin: 0 0 calc(var(--u) * .25); font-size: calc(var(--u) * .7); color: var(--muted); overflow: hidden; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cup-row { display: flex; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .7); font-weight: 600; line-height: 1.25; margin-bottom: calc(var(--u) * .25); align-items: center; }
  .cup-row span:first-child { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cup-row span:last-child { color: var(--muted); font-weight: 800; }
  /* Version lisible de loin : un match par ligne, classement en tableau. */
  .cup-body.v2 { grid-template-columns: minmax(0, 13fr) minmax(0, 7fr); gap: calc(var(--u) * .5); margin-top: calc(var(--u) * .5); }
  .cup-tables.v2 { display: flex; flex-direction: column; overflow: hidden; }
  .mhead { display: flex; align-items: baseline; gap: calc(var(--u) * .4); height: calc(var(--u) * .95); }
  .mhead h3 { margin: 0; color: var(--gold); font-size: calc(var(--u) * .6); flex: 1; }
  .mhead span { color: var(--muted); font-size: calc(var(--u) * .45); white-space: nowrap; }
  .mhead span b { color: #fff; font-size: calc(var(--u) * .55); }
  .mlist { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; gap: calc(var(--u) * .3); }
  .m { display: flex; align-items: center; gap: calc(var(--s) * .45); min-width: 0; padding: 0 calc(var(--s) * .5);
    background: rgba(255,255,255,.07); border-radius: calc(var(--s) * .6); font-size: var(--s); }
  .m .tb { flex: none; display: grid; place-items: center; background: var(--gold); color: #1b1300; font-weight: 900;
    border-radius: 28%; font-style: normal; }
  .m .tm { flex: 1; min-width: 0; font-weight: 800; line-height: 1.15; }
  .m .tm.r { text-align: right; }
  .m .tm div, .m .tm small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .m .tm small { display: block; font-size: .62em; color: var(--muted); font-weight: 600; }
  /* Ligne de match haute : un nom long (équipe de quatre) passe sur deux lignes. */
  .m.two .tm div:only-child { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* Équipe en case de sa couleur, un joueur par étiquette, sans séparateur ; rien n'est coupé. */
  .tbox { flex: 1; min-width: 0; overflow: hidden; border-radius: .45em; padding: .2em .3em; border: max(1.5px, .08em) solid;
    display: flex; flex-direction: column; justify-content: center; }
  .tbox.r { align-items: flex-end; text-align: right; }
  .tbox .tn { font-weight: 900; line-height: 1.1; white-space: nowrap; margin-bottom: .12em; }
  .tbox .chips { display: flex; flex-wrap: wrap; gap: .25em .3em; }
  .tbox.r .chips { justify-content: flex-end; }
  .tbox .chips { font-size: .92em; }
  .tbox .chips span { background: rgba(255,255,255,.13); border-radius: 1em; padding: .05em .35em; font-weight: 800; line-height: 1.15; white-space: nowrap; }
  .tline { display: inline-flex; align-items: center; gap: .45em; white-space: nowrap; }
  .tline i { flex: none; width: .62em; height: .62em; border-radius: .18em; }
  .m .sc { flex: none; font-weight: 900; font-size: 1.25em; font-variant-numeric: tabular-nums; }
  .m .multi { flex: 1; min-width: 0; font-weight: 700; font-size: .9em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .m .clock { flex: none; font-weight: 900; font-size: .85em; font-variant-numeric: tabular-nums; }
  .cup-panel.v2 { background: none; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .4); }
  .cup-panel.v2 > section { background: rgba(255,255,255,.05); border-radius: calc(var(--u) * .6); padding: calc(var(--u) * .5);
    min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .cup-panel.v2 h3 { margin: 0 0 calc(var(--u) * .25); font-size: calc(var(--u) * .6); }
  .rk { flex: 1; min-height: 0; display: flex; gap: calc(var(--u) * .7); }
  .rk > div { flex: 1; min-width: 0; }
  .rk .l { display: grid; align-items: center; }
  .rk .l span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rk .l .n { color: var(--gold); font-weight: 900; }
  .rk .l .n.q { color: #3ccf7f; }
  .rk .l .w, .rk .l .v { text-align: right; font-weight: 900; }
  .rk .l .v { color: rgba(255,255,255,.7); }
  .rk .h { color: rgba(255,255,255,.54); font-weight: 800; }
  .qline, .res { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: calc(var(--u) * .45); margin: calc(var(--u) * .08) 0;
    color: rgba(255,255,255,.7); font-weight: 600; }
  .res b { color: var(--gold); margin: 0 calc(var(--u) * .3); }
  .cup-banner { margin-top: calc(var(--u) * .6); padding: calc(var(--u) * .4) calc(var(--u) * .8); border-radius: calc(var(--u) * .5);
    background: linear-gradient(90deg, #ffc94d, #ffa62b); font-weight: 900; font-size: calc(var(--u) * 1); }
  /* Fin du tournoi : podium et classement général. */
  .cup-final { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: calc(var(--u) * .6); }
  .cup-final h2 { margin: 0; text-align: center; color: var(--gold); font-size: calc(var(--u) * 1.1); }
  .cup-final .step .who { white-space: normal; text-align: center; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .podium { flex: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * .3);
    align-items: end; padding: 0 calc(var(--u) * 3); min-height: 0; }
  .step { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .step .who { font-weight: 900; font-size: calc(var(--u) * .9); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .what { color: var(--muted); font-size: calc(var(--u) * .6); margin-bottom: calc(var(--u) * .2); }
  .step .block { width: 100%; border-radius: calc(var(--u) * .5) calc(var(--u) * .5) 0 0; text-align: center;
    font-weight: 900; font-size: calc(var(--u) * 1.4); padding-top: calc(var(--u) * .2); }
  .others { flex: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; column-gap: calc(var(--u) * 1.2);
    align-content: start; margin-top: calc(var(--u) * .6); overflow: hidden; }
  .others div { display: flex; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .7); line-height: 1.6; break-inside: avoid; }
  .others b { color: var(--gold); width: calc(var(--u) * 1.3); }
  .others span:nth-child(2) { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .others span:last-child { color: var(--muted); font-size: calc(var(--u) * .6); }
  /* En-tête : minuteur et QR code à droite. */
  header .titles { flex: 1; }
  .timer { background: rgba(255,255,255,.1); border-radius: calc(var(--u) * .6); padding: calc(var(--u) * .3) calc(var(--u) * .6);
    text-align: right; flex: none; }
  .timer small { display: block; font-size: calc(var(--u) * .55); color: var(--muted); font-weight: 700; }
  .timer b { font-size: calc(var(--u) * .8); font-weight: 900; font-variant-numeric: tabular-nums; }
  .low { color: #ff8a8a; }
  .over { background: #e5484d; color: #fff !important; border-radius: 1em; padding: 0 .35em; }
  .join { display: flex; align-items: center; gap: calc(var(--u) * .4); background: rgba(255,255,255,.1);
    border-radius: calc(var(--u) * .5); padding: calc(var(--u) * .3); flex: none; }
  .join div { text-align: right; }
  .join small { display: block; font-size: calc(var(--u) * .45); color: rgba(255,255,255,.7); font-weight: 700; }
  .join b { font-size: calc(var(--u) * .6); font-weight: 900; letter-spacing: .08em; }
  .join svg { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); background: #fff; border-radius: calc(var(--u) * .2);
    padding: calc(var(--u) * .15); box-sizing: border-box; }
  /* Avatars : photo, initiale, ou deux membres d'une équipe. */
  .av { border-radius: 50%; display: grid; place-items: center; font-weight: 900; flex: none; color: #fff; }
  .team { position: relative; display: block; flex: none; }
  .team .av { position: absolute; }
  /* Sortie aux fléchettes et cases remplies d'une feuille. */
  .co { border: 2px solid var(--gold); border-radius: 999px; text-align: center; line-height: 1.1; flex: none; }
  .co:empty { display: none; }
  .co small { display: block; color: var(--gold); font-weight: 800; }
  .co b { font-weight: 900; white-space: nowrap; }
  .bar { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); margin-top: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  /* Panneau de droite : historique, courbe, Cricket (en fondu quand il change). */
  .side { flex: 2; min-width: 0; position: relative; }
  /* Fléchettes : le classement réduit d'un tiers, la cible prend le reste. */
  .side.wide { flex: 6; }
  .side.wider { flex: 7; }
  .side > div.bare { background: none; padding: 0; }
  .cricket > b { white-space: nowrap; }
  .side > div { position: absolute; inset: 0; background: rgba(255,255,255,.06); border-radius: calc(var(--u) * .8);
    padding: calc(var(--u) * .6); display: flex; flex-direction: column; overflow: hidden; transition: opacity .6s; }
  .side h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .75); }
  .chart { flex: 1; min-height: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .2) calc(var(--u) * .6); margin-top: calc(var(--u) * .4);
    font-size: calc(var(--u) * .55); color: rgba(255,255,255,.7); font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: calc(var(--u) * .25); }
  .legend i { width: calc(var(--u) * .7); height: calc(var(--u) * .18); border-radius: 9px; }
  .cricket { display: grid; align-items: center; justify-items: center; flex: 1; align-content: start; }
  /* Fléchettes : la cible, et au Cricket la grille dessous. */
  .board { flex: 5; min-height: 0; width: 100%; }
  .side .pair { flex: 1; min-height: 0; display: flex; gap: calc(var(--u) * .5); }
  .side .pair .bw { flex: 12; min-width: 0; display: flex; flex-direction: column; }
  .side .sub { flex: 9; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .name .misses svg { display: block; }
  .cricket > b { font-size: calc(var(--u) * .7); color: rgba(255,255,255,.7); font-weight: 900; }
  .mark { position: relative; display: block; }
  .mark.m1::before, .mark.m2::before, .mark.m2::after { content: ''; position: absolute; left: 12%; right: 12%; top: 50%;
    height: 14%; margin-top: -7%; border-radius: 9px; background: currentColor; transform: rotate(-45deg); }
  .mark.m2::after { transform: rotate(45deg); }
  .mark.m3 { border-radius: 50%; display: grid; place-items: center; color: #fff !important; font-weight: 900; }
  /* Manche enregistrée : carte au centre pendant trois secondes. */
  .main { position: relative; }
  .event { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.85); opacity: 0; pointer-events: none;
    min-width: calc(var(--u) * 12); padding: calc(var(--u) * .9) calc(var(--u) * 1.6); border-radius: var(--u); text-align: center;
    border: calc(var(--u) * .07) solid rgba(255,255,255,.35);
    box-shadow: 0 0 calc(var(--u) * 1.5) rgba(0,0,0,.45); transition: opacity .3s, transform .35s cubic-bezier(.34,1.56,.64,1); z-index: 5; }
  .event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .event h2 { margin: 0; font-size: calc(var(--u) * 1.9); font-weight: 900; }
  .event p { margin: calc(var(--u) * .25) 0 0; font-size: calc(var(--u) * .95); font-weight: 800; }
  .event p.next { font-size: calc(var(--u) * .8); color: rgba(255,255,255,.7); font-weight: 600; }
  /* Fin de partie : en-tête réduit et pas de pied, pour laisser la hauteur au podium. */
  .ended header .badge { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); }
  .ended header .title { font-size: calc(var(--u) * 1); }
  .ended header .subtitle { font-size: calc(var(--u) * .65); }
  .ended .main { margin: calc(var(--u) * .3) 0 0; }
  .ended footer, .ended .info { display: none; }
  /* Fin de partie : podium, confettis, meilleur moment et le reste du classement. */
  .finale { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
  .finale h2 { margin: 0; text-align: center; color: var(--gold); font-size: calc(var(--u) * 1.4); font-weight: 900;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finale .instant { align-self: center; display: flex; align-items: center; gap: calc(var(--u) * .3); margin-top: calc(var(--u) * .25);
    padding: calc(var(--u) * .2) calc(var(--u) * .6); border-radius: var(--u); background: rgba(255,181,52,.18);
    border: calc(var(--u) * .06) solid rgba(255,181,52,.7); font-size: calc(var(--u) * .75); font-weight: 900; }
  .finale .moment { text-align: center; font-size: calc(var(--u) * .7); color: rgba(255,255,255,.7); font-weight: 600; margin-top: calc(var(--u) * .15);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finale .podium { flex: 1; padding: 0 calc(var(--u) * 2); margin-top: calc(var(--u) * .4); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .finale .step { height: 100%; animation: rise .8s cubic-bezier(.34,1.56,.64,1) both; }
  .finale.still .step { animation: none; }
  .finale .step .ring { border-radius: 50%; padding: calc(var(--u) * .12); }
  .finale .step .pts { font-weight: 900; }
  .finale .step .block { display: grid; place-items: center; padding: 0; line-height: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 3)); } to { opacity: 1; transform: none; } }
  .rest { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * .3) calc(var(--u) * .5); margin-top: calc(var(--u) * .5); }
  .rest span { display: flex; align-items: center; gap: calc(var(--u) * .3); background: rgba(255,255,255,.08); border-radius: 999px;
    padding: calc(var(--u) * .2) calc(var(--u) * .5) calc(var(--u) * .2) calc(var(--u) * .2); font-size: calc(var(--u) * .62); font-weight: 700; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cup-table .clock { float: right; font-weight: 900; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="screen idle" id="idle">
  <img src="logo-384.png" alt="">
  <h1>Scoroo</h1>
  <p id="waiting"></p>
</div>
<div class="screen hidden" id="game">
  <header>
    <div class="badge" id="badge"></div>
    <div class="titles"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
    <div class="timer hidden" id="timer"></div>
    <div class="join hidden" id="join"></div>
  </header>
  <div class="info" id="info"></div>
  <div class="main">
    <div class="rows" id="rows"></div>
    <div class="side hidden" id="side"></div>
    <div class="finale hidden" id="finale"></div>
    <div class="event" id="event"></div>
  </div>
  <footer><img src="logo-96.png" alt=""><span id="footer"></span><span class="banner" id="banner"></span></footer>
</div>
<div class="screen hidden" id="cup">
  <header>
    <div class="badge" style="color: var(--gold)">🏆</div>
    <div class="titles"><div class="title" id="cup-title"></div><div class="subtitle" id="cup-subtitle"></div></div>
    <div class="join hidden" id="cup-join"></div>
  </header>
  <div class="cup-banner hidden" id="cup-banner"></div>
  <div class="cup-final hidden" id="cup-final"></div>
  <div class="cup-body" id="cup-body">
    <div class="cup-tables" id="cup-tables"></div>
    <div class="cup-panel" id="cup-panel"></div>
  </div>
</div>
<script>
(function () {
  const NS = 'urn:x-cast:com.scoroo.tv';
  const $ = (id) => document.getElementById(id);
  const rowsEl = $('rows');
  const rows = new Map(); // joueur → { el, score }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Photos des joueurs, envoyées une par une avant le tableau : clé → image (data URL).
  const PHOTOS = {};

  // Écran d'attente dans la langue de la télé, avant le premier message du téléphone.
  const WAITING = {
    fr: 'Ouvrez une partie sur le téléphone', en: 'Open a game on your phone', es: 'Abre una partida en el teléfono',
    de: 'Öffne ein Spiel auf dem Handy', it: 'Apri una partita sul telefono',
  };
  const lang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  const waitingText = WAITING[lang] || WAITING.en;

  // Photo, initiale, ou les deux membres d'une équipe (« Léa & Tom »).
  function avatarHtml(p, size) {
    const one = (m, s, extra) => {
      const photo = PHOTOS[m.photo];
      return '<span class="av" style="width:' + s + 'px;height:' + s + 'px;font-size:' + s * ((m.initial || '').length > 1 ? 0.36 : 0.46) +
        'px;background:' + (photo ? 'center / cover no-repeat url(' + photo + '), ' : '') + esc(m.color || '#555') + (extra || '') + '">' +
        (photo ? '' : esc(m.initial || '?')) + '</span>';
    };
    const members = p.members || [];
    if (members.length < 2 || PHOTOS[p.photo]) return one(p, size);
    const small = size * 0.72;
    return '<span class="team" style="width:' + size + 'px;height:' + size + 'px">' + one(members[0], small, ';left:0;top:0') +
      one(members[1], small - size * 0.06, ';right:0;bottom:0;box-shadow:0 0 0 ' + size * 0.03 + 'px var(--bg)') + '</span>';
  }

  // Décomptes (minuteur de la partie, tables du tournoi) : fin calculée à la réception du message.
  const ends = {};
  function endFor(key, remaining) {
    const known = ends[key];
    if (!known || known.remaining !== remaining) ends[key] = { remaining, at: Date.now() + remaining * 1000 };
    return ends[key].at;
  }
  function tick() {
    document.querySelectorAll('[data-end]').forEach((el) => {
      const left = Math.round((Number(el.dataset.end) - Date.now()) / 1000);
      // Temps écoulé : un chrono rouge à 0:00 (plus parlant et plus court qu'un texte).
      el.textContent = left <= 0 ? '⏱ 0:00' : Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      el.classList.toggle('low', left < 60);
      el.classList.toggle('over', left <= 0);
    });
  }
  setInterval(tick, 1000);

  // QR code reçu en lignes de « 0 » et « 1 » : dessiné en SVG.
  function qrSvg(lines) {
    const n = lines.length;
    let d = '';
    lines.forEach((line, y) => { for (let x = 0; x < line.length; x++) if (line[x] === '1') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });
    return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path d="' + d + '" fill="#000"/></svg>';
  }

  let lastEvent = null;
  let eventTimer = null;
  let finaleFor = null;

  function render(data) {
    if (!data || typeof data !== 'object') return;
    const game = data.kind === 'game';
    const cup = data.kind === 'cup';
    $('idle').classList.toggle('hidden', game || cup);
    $('game').classList.toggle('hidden', !game);
    $('cup').classList.toggle('hidden', !cup);
    if (cup) { renderCup(data); return; }
    $('waiting').textContent = data.waiting || waitingText;
    if (!game) return;
    document.documentElement.style.setProperty('--game', data.color || '#0b3a6e');
    // Pictogramme du jeu (icons/<jeu>.png, générés par tool/store_assets/tv_icons_test.dart) ; un
    // jeu créé par le joueur n'en a pas : son initiale, à sa couleur.
    const badge = $('badge');
    if (/^\w+$/.test(data.icon || '')) badge.innerHTML = '<img src="icons/' + data.icon + '.png" alt="">';
    else badge.textContent = data.initial || '';
    badge.style.color = data.color || '#0b3a6e';
    $('game').style.backgroundImage = /^\w+$/.test(data.pattern || '') ? 'url(backdrops/' + data.pattern + '.png)' : 'none';
    $('title').textContent = data.title || '';
    $('subtitle').textContent = data.subtitle || '';
    $('footer').textContent = data.footer || '';
    // Le podium affiche déjà le vainqueur en grand.
    $('banner').textContent = data.podium ? '' : data.banner || '';
    renderHeader(data);
    renderInfo(data.podium ? [] : data.info || []);
    renderEvent(data);
    const finale = $('finale');
    finale.classList.toggle('hidden', !data.podium);
    rowsEl.classList.toggle('hidden', !!data.podium);
    // Fin de partie : tout l'écran pour le podium. Le panneau des manches ne revient pas (son
    // alternance le réaffichait à côté, en grand), l'en-tête se fait petit et le pied disparaît.
    $('game').classList.toggle('ended', !!data.podium);
    if (data.podium) {
      sideData = null;
      $('side').classList.add('hidden');
      $('side').innerHTML = '';
      renderFinale(data);
      return;
    }
    finaleFor = null;
    finaleKey = null;
    const everyone = data.players || [];
    // Au-delà de 6 joueurs, le classement prend toute la largeur (sur deux colonnes). Aux
    // fléchettes, la cible reste : le classement n'affiche alors que 6 joueurs (les 5 premiers et
    // celui qui lance).
    renderSide(everyone.length <= 6 || data.dartboard ? data : null);
    const sideOn = !$('side').classList.contains('hidden');
    const players = data.dartboard && sideOn && everyone.length > 6 ? windowPlayers(everyone, 6) : everyone;

    const height = rowsEl.clientHeight || window.innerHeight * 0.7;
    const width = rowsEl.clientWidth || window.innerWidth * 0.9;
    // Beaucoup de joueurs : deux colonnes, pour que tout tienne au-dessus du bas de l'écran.
    // (À côté du panneau des manches, une seule colonne : sur deux, les noms étaient coupés.)
    const sideShown = !$('side').classList.contains('hidden');
    const columns = players.length > 5 && width >= 640 && !sideShown ? 2 : 1;
    const perColumn = Math.ceil(players.length / columns);
    const gap = 16;
    const columnW = (width - gap * (columns - 1)) / columns;
    const rowH = Math.max(20, Math.min(height / Math.max(perColumn, 1), columnW / 4, 220));
    const seen = new Set();
    const toFit = [];
    players.forEach((p, pos) => {
      seen.add(p.i);
      let row = rows.get(p.i);
      if (!row) {
        const el = document.createElement('div');
        el.className = 'row';
        el.innerHTML = '<div class="rank"></div><div class="avatar"></div>' +
          '<div class="name"><span></span><i class="misses"></i><small></small><i class="bar hidden"><i></i></i></div>' +
          '<div class="co"></div><div class="crown">♛</div><div class="delta"></div><div class="score">0</div>';
        el.style.top = (pos % perColumn) * rowH + 'px';
        rowsEl.appendChild(el);
        row = { el, score: 0 };
        rows.set(p.i, row);
      }
      const h = rowH * 0.9;
      const el = row.el;
      Object.assign(el.style, {
        top: (pos % perColumn) * rowH + 'px', left: Math.floor(pos / perColumn) * (columnW + gap) + 'px', width: columnW + 'px',
        height: h + 'px', borderRadius: h * 0.24 + 'px', padding: '0 ' + h * 0.22 + 'px',
      });
      el.classList.toggle('leader', !!p.leader);
      el.classList.toggle('turn', !!p.turn);
      const [rank, avatar, name, co, crown, delta, score] = el.children;
      // Mölkky : les ratés consécutifs, en points (rouges quand le lancer est raté).
      const misses = name.children[1];
      misses.innerHTML = typeof p.misses === 'number'
        ? [0, 1, 2].map((m) => '<b style="width:' + h * 0.13 + 'px;height:' + h * 0.13 + 'px;background:' +
            (m < p.misses ? '#ff6b6b' : 'rgba(255,255,255,.24)') + '"></b>').join('')
        : Array.isArray(p.ammo) ? ammoHtml(p.ammo[0], p.ammo[1], h * 0.22) + (p.killer ? crossHtml(h * 0.22) : '') : '';
      rank.textContent = p.rank || '';
      Object.assign(rank.style, { width: h * 0.75 + 'px', fontSize: h * 0.3 + 'px' });
      avatar.innerHTML = avatarHtml(p, h * 0.62);
      avatar.style.marginRight = h * 0.2 + 'px';
      name.firstChild.textContent = p.name || '';
      name.firstChild.style.fontSize = h * 0.36 + 'px';
      toFit.push([name.firstChild, h * 0.36]);
      // Sortie aux fléchettes : en pastille si la ligne est large, sinon sous le nom.
      const chip = p.checkout && columnW >= h * 6;
      name.children[2].textContent = [p.dealer ? data.dealerLabel : null, p.note,
        p.checkout && !chip ? data.checkoutLabel + ' ' + p.checkout : null].filter(Boolean).join(' · ');
      name.children[2].style.fontSize = h * 0.18 + 'px';
      // Feuilles : les cases remplies, en barre à la couleur du joueur.
      const bar = name.children[3];
      bar.classList.toggle('hidden', typeof p.progress !== 'number');
      Object.assign(bar.firstChild.style, { width: Math.round((p.progress || 0) * 100) + '%', background: p.color || '#fff' });
      bar.style.marginRight = h * 0.4 + 'px';
      co.innerHTML = chip ? '<small>' + esc(data.checkoutLabel) + '</small><b>' + esc(p.checkout) + '</b>' : '';
      Object.assign(co.style, { fontSize: h * 0.2 + 'px', padding: h * 0.05 + 'px ' + h * 0.16 + 'px', marginRight: h * 0.2 + 'px' });
      if (co.firstChild) co.firstChild.style.fontSize = h * 0.13 + 'px';
      Object.assign(crown.style, { fontSize: h * 0.38 + 'px', margin: '0 ' + h * 0.15 + 'px' });
      delta.textContent = p.delta || '';
      // Le plus bas gagne (Skyjo, Rami…) : des points en plus sont une mauvaise nouvelle, en rouge.
      delta.className = 'delta' + (p.delta ? (p.delta.startsWith('+') !== !!data.low ? ' up' : ' down') : '');
      Object.assign(delta.style, { fontSize: h * 0.24 + 'px', marginRight: p.delta ? h * 0.2 + 'px' : '0' });
      score.style.fontSize = h * 0.52 + 'px';
      // Killer : les vies en cœurs à la place du score (perdues : cœurs vides).
      if (Array.isArray(p.lives)) {
        row.score = undefined;
        let hearts = '';
        for (let l = 0; l < p.lives[1]; l++) {
          hearts += '<span style="color:' + (l < p.lives[0] ? '#ff5a6e' : 'rgba(255,255,255,.38)') + '">' + (l < p.lives[0] ? '♥' : '♡') + '</span>';
        }
        score.innerHTML = '<span style="font-size:' + h * 0.4 + 'px;letter-spacing:' + h * 0.03 + 'px">' + hearts + '</span>';
      } else {
        if (row.score === undefined) score.textContent = Number(p.score) || 0;
        animate(row, score, Number(p.score) || 0);
      }
    });
    // Nom plus large que sa place : il rétrécit (jusqu'à 60 %) avant d'être coupé.
    toFit.forEach(([el, size]) => {
      let k = 1;
      Object.assign(el.style, { whiteSpace: '', display: '', webkitLineClamp: '', webkitBoxOrient: '', lineHeight: '' });
      while (k > 0.6 && el.scrollWidth > el.clientWidth + 1) { k -= 0.08; el.style.fontSize = size * k + 'px'; }
      // Toujours trop long (« Julie & Marc » dans une grande ligne) : sur deux lignes.
      if (el.scrollWidth > el.clientWidth + 1 && size > 26) {
        Object.assign(el.style, { whiteSpace: 'normal', display: '-webkit-box', webkitLineClamp: '2', webkitBoxOrient: 'vertical',
          lineHeight: '1.05', fontSize: size * 0.72 + 'px' });
      }
    });
    for (const [i, row] of rows) {
      if (!seen.has(i)) { row.el.remove(); rows.delete(i); }
    }
  }

  // En-tête : minuteur de la partie et QR code d'une partie partagée.
  function renderHeader(data) {
    const timer = $('timer');
    timer.classList.toggle('hidden', !data.timer);
    if (data.timer) {
      timer.innerHTML = '<small>' + esc(data.timer.label) + '</small><b data-end="' + endFor('game', data.timer.remaining) +
        '" data-over="' + esc(data.timer.over) + '"></b>';
    }
    fillJoin($('join'), data.join);
    tick();
  }

  // Partie ou tournoi partagé : le code et son QR code, à scanner avec Scoroo pour suivre sur son téléphone.
  function fillJoin(el, join) {
    const shown = join && (join.qr || []).length && window.innerWidth > window.innerHeight;
    el.classList.toggle('hidden', !shown);
    if (shown) el.innerHTML = '<div><small>' + esc(join.text) + '</small><b>' + esc(join.code) + '</b></div>' + qrSvg(join.qr);
  }

  // Pastilles sous le titre : objectif, donneur, cartes de la manche.
  const ICONS = { target: '🏁', dealer: '✋', start: '▶️', cards: '🃏' };
  function renderInfo(info) {
    // « Au tour de … » se lit seul, sans pictogramme.
    $('info').innerHTML = info.map((i) => '<span class="pill">' + (i.icon === 'turn' ? '' : '<i>' + (ICONS[i.icon] || 'ℹ️') + '</i>') +
      esc(i.text) + '</span>').join('');
  }

  // Mélange de deux couleurs « #rrggbb » : [t] de la seconde (0 à 1). Toute autre écriture de
  // couleur est rendue telle quelle.
  function mix(a, b, t) {
    const hex = (c) => /^#[0-9a-f]{6}$/i.test(c) ? [1, 3, 5].map((i) => parseInt(c.substr(i, 2), 16)) : null;
    const x = hex(a), y = hex(b);
    if (!x || !y) return a;
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  // Clarté d'une couleur « #rrggbb », de 0 (noir) à 1 (blanc).
  function luminance(c) {
    if (!/^#[0-9a-f]{6}$/i.test(c)) return 1;
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.substr(i, 2), 16));
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }

  // Manche enregistrée : une carte au centre pendant trois secondes (rien au premier affichage).
  function renderEvent(data) {
    const e = data.event;
    const id = e && typeof e.id === 'number' ? e.id : null;
    const el = $('event');
    if (id !== null && lastEvent !== null && id > lastEvent) {
      // Fond opaque, calculé ici : « color-mix » n'existe pas sur les Chromecast anciens (la carte
      // restait transparente, donc illisible par-dessus le tableau).
      // Couleur sombre (Skull King, bleu nuit comme le fond) : éclaircie, pour que la carte se détache.
      const base = luminance(data.color || '#0b3a6e') < 0.3 ? mix(data.color || '#0b3a6e', '#ffffff', 0.28) : data.color || '#0b3a6e';
      el.style.backgroundColor = mix(base, '#0e1726', 0.3);
      el.style.backgroundImage = 'linear-gradient(135deg, ' + mix(base, '#ffffff', 0.12) + ', ' + mix(base, '#0e1726', 0.45) + ')';
      el.innerHTML = '<h2>' + esc(e.title) + '</h2>' + (e.best ? '<p>⭐ ' + esc(e.best) + '</p>' : '') +
        (e.next ? '<p class="next">' + esc(e.next) + '</p>' : '');
      el.classList.add('show');
      clearTimeout(eventTimer);
      eventTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }
    if (data.id !== render.gameId) { lastEvent = null; render.gameId = data.id; }
    lastEvent = id;
  }

  // Panneau de droite : la grille du Cricket, ou l'historique et la courbe en alternance.
  let sideIndex = 0;
  let sideData = null;
  setInterval(() => { sideIndex++; if (sideData) renderSide(sideData, true); }, 15000);
  function renderSide(data, rotating) {
    const el = $('side');
    const wide = window.innerWidth > window.innerHeight * 1.25;
    const panels = !data ? [] : data.dartboard ? ['dartboard'] : data.cricket ? ['cricket'] : [data.history && (data.history.rows || []).length ? 'history' : null,
      data.chart ? 'chart' : null].filter(Boolean);
    sideData = data;
    if (!panels.length || !wide) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.classList.remove('hidden');
    // Cricket : cible et grille côte à côte, le panneau prend autant de place que le classement.
    // Fléchettes : une grande cible, le panneau prend autant de place que le classement (plus
    // encore au Cricket, avec la grille à côté).
    el.classList.toggle('wide', !!data.dartboard && !data.cricket);
    el.classList.toggle('wider', !!(data.dartboard && data.cricket));
    const kind = panels[sideIndex % panels.length];
    const box = document.createElement('div');
    el.querySelectorAll(':scope > div').forEach((old) => {
      if (rotating && old.dataset.kind !== kind) { old.style.opacity = '0'; setTimeout(() => old.remove(), 600); } else old.remove();
    });
    box.dataset.kind = kind;
    el.appendChild(box);
    if (kind === 'history') fillHistory(box, data.history);
    if (kind === 'chart') fillChart(box, data.chart);
    if (kind === 'cricket') fillCricket(box, data.cricket);
    if (kind === 'dartboard') fillDartboard(box, data.dartboard, data.cricket);
    if (rotating) { box.style.opacity = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { box.style.opacity = '1'; })); }
  }

  // Historique des manches : les plus récentes en bas.
  function fillHistory(el, h) {
    const players = h.players || [];
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    const good = h.low ? 'down' : 'up', bad = h.low ? 'up' : 'down';
    const cls = (s) => (s.startsWith('+') ? good : s.startsWith('−') ? bad : 'zero');
    el.innerHTML = '<h3>' + esc(h.title) + '</h3>' +
      '<div class="hrow hhead"><span></span>' + players.map((p) => '<span>' + avatarHtml(p, u * 1.1) + '</span>').join('') + '</div>' +
      (h.rows || []).map((r, k, all) => '<div class="hrow' + (k === all.length - 1 ? ' last' : '') + '"><span>' + esc(r.n) + '</span>' +
        (r.scores || []).map((s) => '<span class="' + cls(String(s)) + '">' + esc(s) + '</span>').join('') + '</div>').join('');
    el.querySelectorAll('.hhead > span > *').forEach((a) => { a.style.margin = '0 auto'; });
    // Ce qui dépasse : on retire les manches les plus anciennes.
    const data = el.querySelectorAll('.hrow:not(.hhead)');
    for (let k = 0; el.scrollHeight > el.clientHeight + 1 && k < data.length - 1; k++) data[k].remove();
  }

  // Courbe des scores : une ligne par joueur, avec un point au bout.
  function fillChart(el, chart) {
    el.innerHTML = '<h3>' + esc(chart.title) + '</h3><svg class="chart"></svg><div class="legend">' +
      (chart.series || []).map((s) => '<span><i style="background:' + esc(s.color) + '"></i>' + esc(s.name) + '</span>').join('') + '</div>';
    const svg = el.querySelector('svg');
    const w = svg.clientWidth || 400, h = svg.clientHeight || 200;
    const all = (chart.series || []).flatMap((s) => s.points || []);
    if (!all.length) return;
    let lo = Math.min(0, ...all), hi = Math.max(...all);
    if (hi - lo < 1) hi = lo + 1;
    const count = Math.max(...chart.series.map((s) => (s.points || []).length));
    const pad = 8;
    const x = (k) => pad + (count <= 1 ? 0 : (w - pad * 2) * k / (count - 1));
    const y = (v) => pad + (h - pad * 2) - (v - lo) / (hi - lo) * (h - pad * 2);
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.innerHTML = '<line x1="0" x2="' + w + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="rgba(255,255,255,.24)"/>' +
      chart.series.map((s) => {
        const pts = s.points || [];
        if (!pts.length) return '';
        const last = pts.length - 1;
        return '<polyline fill="none" stroke="' + esc(s.color) + '" stroke-width="' + Math.max(2, u * 0.12) +
          '" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map((v, k) => x(k) + ',' + y(v)).join(' ') + '"/>' +
          '<circle cx="' + x(last) + '" cy="' + y(pts[last]) + '" r="' + u * 0.22 + '" fill="' + esc(s.color) + '" stroke="#fff" stroke-width="' +
          Math.max(1.5, u * 0.05) + '"/>';
      }).join('');
  }

  // Cricket : numéros en colonnes, une ligne par joueur ; « / », « X », puis numéro fermé.
  function fillCricket(el, c) {
    const targets = c.targets || [];
    const list = c.rows || [];
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    el.innerHTML = '<h3>' + esc(c.title) + '</h3><div class="cricket"></div>';
    const grid = el.querySelector('.cricket');
    // Le titre, puis la ligne des numéros et une ligne par joueur, toutes de la même hauteur.
    const rowH = Math.min(u * 1.6, (el.clientHeight - u * 2.4) / (list.length + 1));
    const mark = rowH * 0.62;
    grid.style.gridTemplateColumns = rowH * 1.1 + 'px repeat(' + targets.length + ', minmax(0, 1fr))';
    grid.style.gridAutoRows = rowH + 'px';
    grid.innerHTML = '<span></span>' + targets.map((t) => '<b>' + esc(t) + '</b>').join('') + list.map((r) =>
      '<span style="justify-self:start">' + avatarHtml(r, rowH * 0.8) + '</span>' + (r.marks || []).slice(0, targets.length).map((m) =>
        '<span class="mark m' + Math.min(3, m) + '" style="width:' + mark + 'px;height:' + mark + 'px;color:' + esc(r.color) +
        (m >= 3 ? ';background:' + esc(r.color) + ';font-size:' + mark * 0.6 + 'px">✕' : '">') + '</span>').join('')).join('');
  }

  // Killer : munitions, en balles debout (dorées une fois chargées), et viseur des killers.
  function ammoHtml(loaded, total, size) {
    const w = size * 0.42;
    const line = 'rgba(255,255,255,.38)';
    let out = '';
    for (let b = 0; b < total; b++) {
      const on = b < loaded;
      out += '<svg width="' + w + '" height="' + size + '" viewBox="-4 -4 50 108" style="margin-right:' + size * 0.2 + 'px">' +
        '<path d="M0 38 Q0 8 21 0 Q42 8 42 38 Z" fill="' + (on ? '#d9824a' : 'none') + '" stroke="' + (on ? 'none' : line) + '" stroke-width="5"/>' +
        '<rect x="0" y="38" width="42" height="54" rx="5" fill="' + (on ? '#e8b931' : 'none') + '" stroke="' + (on ? 'none' : line) + '" stroke-width="5"/>' +
        '<rect x="-3" y="90" width="48" height="10" fill="' + (on ? '#c99a1c' : line) + '"/></svg>';
    }
    return out;
  }
  function crossHtml(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="margin-left:' + size * 0.3 + 'px">' +
      '<circle cx="12" cy="12" r="7" fill="none" stroke="#ff6b6b" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="#ff6b6b"/>' +
      '<path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#ff6b6b" stroke-width="2.4" stroke-linecap="round"/></svg>';
  }

  // Fléchettes : la cible de l'appli (mêmes anneaux, mêmes couleurs), zones utiles colorées,
  // fléchettes du tour numérotées ; au Cricket, la grille des numéros dessous.
  const BOARD_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const RING = { bullIn: 0.075, bullOut: 0.16, tripleIn: 0.54, tripleOut: 0.66, doubleIn: 0.87, doubleOut: 1, numbers: 1.17 };
  function fillDartboard(el, board, cricket) {
    // Cricket : la cible et la grille côte à côte (l'une sous l'autre, elles ne tenaient pas).
    // Ni titre ni fond : la cible prend toute la place (le joueur qui lance est cerclé à gauche).
    el.classList.add('bare');
    el.innerHTML = cricket
      ? '<div class="pair"><div class="bw"><svg class="board"></svg></div><div class="sub"></div></div>'
      : '<svg class="board"></svg>';
    const svg = el.querySelector('svg');
    const size = Math.max(50, Math.min(svg.clientWidth || 300, svg.clientHeight || 300));
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    const c = size / 2, r = size / 2 / RING.numbers, step = Math.PI / 10;
    const zones = new Map((board.zones || []).map((z) => [z[0] + ':' + z[1], z]));
    const any = zones.size > 0;
    const pt = (radius, a) => [c + Math.cos(a) * r * radius, c + Math.sin(a) * r * radius];
    const sector = (r1, r2, a0) => {
      const [x1, y1] = pt(r2, a0), [x2, y2] = pt(r2, a0 + step), [x3, y3] = pt(r1, a0 + step), [x4, y4] = pt(r1, a0);
      return 'M' + x1 + ' ' + y1 + 'A' + r * r2 + ' ' + r * r2 + ' 0 0 1 ' + x2 + ' ' + y2 + 'L' + x3 + ' ' + y3 +
        'A' + r * r1 + ' ' + r * r1 + ' 0 0 0 ' + x4 + ' ' + y4 + 'Z';
    };
    let out = '<circle cx="' + c + '" cy="' + c + '" r="' + r * RING.numbers + '" fill="#111827"/>';
    const labels = [];
    const zone = (shape, base, seg, mult, at, fs, label) => {
      out += shape.replace('/>', ' fill="' + base + '"/>');
      const z = zones.get(seg + ':' + mult);
      if (z) {
        // Simples en teinte claire, doubles et triples en teinte pleine et foncée, comme dans l'appli.
        const fill = mult === 1 ? z[2] : mix(z[2], '#000000', 0.3);
        out += shape.replace('/>', ' fill="' + fill + '"' + (mult === 1 ? ' fill-opacity=".6"' : '') + ' stroke="#fff" stroke-width="1.6"/>');
        if (label !== false && z[3]) labels.push([at, z[3], fs]);
      } else if (any) {
        out += shape.replace('/>', ' fill="#000" fill-opacity=".5"/>');
      }
    };
    BOARD_ORDER.forEach((seg, k) => {
      const mid = -Math.PI / 2 + k * step, a0 = mid - step / 2, even = k % 2 === 0;
      const path = (r1, r2) => '<path d="' + sector(r1, r2, a0) + '"/>';
      zone(path(RING.bullOut, RING.tripleIn), even ? '#1F2937' : '#F3E9D2', seg, 1, pt((RING.bullOut + RING.tripleIn) / 2, mid), r * 0.085, false);
      zone(path(RING.tripleIn, RING.tripleOut), even ? '#DC2626' : '#16A34A', seg, 3, pt((RING.tripleIn + RING.tripleOut) / 2, mid), r * 0.075);
      zone(path(RING.tripleOut, RING.doubleIn), even ? '#1F2937' : '#F3E9D2', seg, 1, pt((RING.tripleOut + RING.doubleIn) / 2, mid), r * 0.085);
      zone(path(RING.doubleIn, RING.doubleOut), even ? '#DC2626' : '#16A34A', seg, 2, pt((RING.doubleIn + RING.doubleOut) / 2, mid), r * 0.075);
    });
    for (let k = 0; k < 20; k++) {
      const a = -Math.PI / 2 + k * step - step / 2;
      const [x1, y1] = pt(RING.bullOut, a), [x2, y2] = pt(RING.doubleOut, a);
      out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="rgba(255,255,255,.35)" stroke-width="1"/>';
    }
    zone('<circle cx="' + c + '" cy="' + c + '" r="' + r * RING.bullOut + '"/>', '#16A34A', 25, 1, [c, c - r * (RING.bullIn + RING.bullOut) / 2], r * 0.07);
    zone('<circle cx="' + c + '" cy="' + c + '" r="' + r * RING.bullIn + '"/>', '#DC2626', 25, 2, [c, c], r * 0.07);
    const text = (x, y, t, fs, extra) => '<text x="' + x + '" y="' + y + '" font-size="' + fs + '" font-weight="900" fill="#fff" ' +
      'text-anchor="middle" dominant-baseline="central"' + (extra || '') + '>' + esc(t) + '</text>';
    BOARD_ORDER.forEach((seg, k) => {
      const [x, y] = pt((RING.doubleOut + RING.numbers) / 2, -Math.PI / 2 + k * step);
      out += text(x, y, String(seg), r * 0.1);
    });
    // Libellés des zones (« +3 », « 1·2 »…) : en blanc sur une pastille sombre, lisibles de loin.
    labels.forEach(([[x, y], t, fs]) => {
      const size = fs * 1.45;
      const w = String(t).length * size * 0.62 + size * 0.6;
      out += '<rect x="' + (x - w / 2) + '" y="' + (y - size * 0.62) + '" width="' + w + '" height="' + size * 1.24 + '" rx="' + size * 0.62 +
        '" fill="#111827" fill-opacity=".85"/>' + text(x, y, t, size);
    });
    (board.darts || []).forEach(([seg, mult], i) => {
      if (!seg) return;
      let x, y;
      if (seg === 25) { x = c + (i - 1) * r * 0.05; y = c; } else {
        const k = BOARD_ORDER.indexOf(seg);
        const radius = mult === 3 ? (RING.tripleIn + RING.tripleOut) / 2 : mult === 2 ? (RING.doubleIn + RING.doubleOut) / 2 : (RING.tripleOut + RING.doubleIn) / 2;
        [x, y] = pt(radius, -Math.PI / 2 + k * step + (i - 1) * step * 0.22);
      }
      // Pastilles plus grandes que dans l'appli : la télé se regarde de loin.
      out += '<circle cx="' + x + '" cy="' + y + '" r="' + r * 0.1 + '" fill="#fff"/><circle cx="' + x + '" cy="' + y + '" r="' + r * 0.077 + '" fill="#0B3A6E"/>' +
        text(x, y, String(i + 1), r * 0.1);
    });
    svg.innerHTML = out;
    if (cricket) fillCricket(el.querySelector('.sub'), cricket);
  }

  // Fin de partie : podium des trois premiers, confettis, meilleur moment, puis les autres.
  // Podium déjà affiché : la télé reçoit encore des messages (renvois de sécurité, photos, mises à
  // jour) ; il n'est redessiné que si son contenu change, et alors sans rejouer l'animation.
  let finaleKey = null;
  function renderFinale(data) {
    const f = data.podium;
    const el = $('finale');
    const key = JSON.stringify([data.id, f, (data.players || []).map((p) => [p.i, p.name, p.score, p.photo, !!PHOTOS[p.photo]]),
      window.innerWidth, window.innerHeight]);
    if (key === finaleKey) return;
    finaleKey = key;
    el.classList.toggle('still', finaleFor === data.id);
    const places = f.places || [];
    const shown = new Set(places.map((p) => p.i));
    const rest = (data.players || []).filter((p) => !shown.has(p.i)).slice(0, 8);
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    const colors = ['#ffb534', '#b8c2cf', '#d9935e'];
    // 7 Wonders Duel : la victoire immédiate (suprématie…), en pastille dorée sous le titre.
    const instant = f.instant && f.instant.label
      ? '<div class="instant"><span>' + ({ science: '🧪', politics: '🗳️' }[f.instant.kind] || '🛡️') + '</span>' + esc(f.instant.label) + '</div>' : '';
    el.innerHTML = '<h2>' + esc(f.title) + '</h2>' + instant + (f.highlight ? '<div class="moment">' + esc(f.highlight) + '</div>' : '') +
      '<div class="podium"></div>' + (rest.length ? '<div class="rest">' + rest.map((p) => '<span>' + avatarHtml(p, u * 1.1) +
      esc(p.rank) + '  ' + esc(p.name) + '  ·  ' + esc(p.score) + '</span>').join('') + '</div>' : '') + '<canvas id="confetti"></canvas>';
    const podium = el.querySelector('.podium');
    const H = podium.clientHeight || window.innerHeight * 0.5;
    // Même échelle pour les trois marches, calculée sur le premier (le plus haut) : le vainqueur
    // reste le plus grand, et tout tient au-dessus de sa marche.
    const head = (k) => u * (1.3 * k + 3.64 * k + 0.25 + (1.05 + 1.3) * 1.3 * Math.max(k, 0.6) + 0.2);
    let k = 1;
    while (k > 0.3 && head(k) > H * 0.76) k -= 0.05;
    const t = Math.max(k, 0.6);
    const step = (i) => {
      const p = places[i];
      if (!p) return '<div></div>';
      const first = i === 0;
      // Marche selon le rang réel : deux ex æquo ont la même hauteur et la même couleur.
      const rank = parseInt(p.rank, 10);
      const level = Math.max(0, Math.min(2, (isNaN(rank) ? i + 1 : rank) - 1));
      const block = H * [0.24, 0.17, 0.11][level];
      return '<div class="step" style="animation-delay:' + (2 - i) * 0.25 + 's">' + (first ? '<div style="font-size:' + u * 1.3 * k + 'px">🏆</div>' : '') +
        '<span class="ring" style="background:' + colors[level] + '">' + avatarHtml(p, u * (first ? 3.4 : 2.6) * k) + '</span>' +
        '<div class="who" style="font-size:' + u * (first ? 1.05 : 0.85) * t + 'px;margin-top:' + u * 0.25 + 'px">' + esc(p.name) + '</div>' +
        '<div class="pts" style="font-size:' + u * (first ? 1.3 : 1.0) * t + 'px;color:' + colors[level] + ';margin-bottom:' + u * 0.2 + 'px">' + esc(p.score) + '</div>' +
        '<div class="block" style="height:' + block + 'px;font-size:' + Math.min(u * 1.6, block * 0.7) + 'px;background:linear-gradient(' +
        colors[level] + ', ' + mix(colors[level], '#0e1726', 0.6) + ')">' + esc(p.rank || i + 1) + '</div></div>';
    };
    podium.innerHTML = step(1) + step(0) + step(2);
    if (finaleFor !== data.id) { finaleFor = data.id; confetti(el.querySelector('#confetti')); }
  }

  // Confettis qui tombent pendant six secondes.
  function confetti(canvas) {
    if (!canvas || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    const colors = ['#ffb534', '#ff6b6b', '#7ee2a8', '#6cb4ff', '#c18bff', '#ffffff'];
    const bits = Array.from({ length: 90 }, (_, k) => ({ x: Math.random() * w, delay: Math.random() * 0.35, speed: 0.8 + Math.random() * 0.7,
      size: 5 + Math.random() * 6, color: colors[k % colors.length], k }));
    const start = performance.now();
    const frame = (now) => {
      const t = (now - start) / 6000;
      ctx.clearRect(0, 0, w, h);
      if (t >= 1 || !canvas.isConnected) return;
      const fade = t > 0.8 ? (1 - t) / 0.2 : 1;
      for (const b of bits) {
        const p = Math.max(0, Math.min(1, (t - b.delay) / (1 - b.delay))) * b.speed;
        if (p <= 0) continue;
        ctx.save();
        ctx.translate(b.x + Math.sin(p * 9 + b.k) * 18, -20 + p * (h + 40));
        ctx.rotate(p * 12 + b.k);
        ctx.globalAlpha = fade;
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.size / 2, -b.size * 0.22, b.size, b.size * 0.45);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // Les scores défilent jusqu'à leur nouvelle valeur, comme dans l'appli.
  // Au plus [count] joueurs : les premiers, et toujours celui dont c'est le tour.
  function windowPlayers(players, count) {
    const shown = players.slice(0, count);
    const turn = players.find((p) => p.turn);
    if (turn && !shown.includes(turn)) shown[count - 1] = turn;
    return shown;
  }

  function animate(row, el, target) {
    const from = row.score;
    row.score = target;
    if (from === target) { el.textContent = target; return; }
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 550);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (target - from) * eased);
      if (t < 1 && row.score === target) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // Grand tournoi : une carte par table, puis les prochains matchs et le classement.
  function renderCup(data) {
    $('cup-title').textContent = data.title || '';
    $('cup-subtitle').textContent = data.subtitle || '';
    fillJoin($('cup-join'), data.join);
    const banner = $('cup-banner');
    banner.textContent = data.banner ? '🏆 ' + data.banner : '';
    banner.classList.toggle('hidden', !data.banner);
    const fin = data.final;
    $('cup-final').classList.toggle('hidden', !fin);
    $('cup-body').classList.toggle('hidden', !!fin);
    if (fin) {
      banner.classList.add('hidden');
      const rows = fin.rows || [];
      const colors = ['#ffb534', '#a7b1be', '#cd8b5a'];
      const heights = ['calc(var(--u) * 4.4)', 'calc(var(--u) * 3.2)', 'calc(var(--u) * 2.3)'];
      const step = (i) => rows[i] ? '<div class="step"><div class="who">' + (i === 0 ? '🏆 ' : '') + esc(rows[i].name) + '</div>' +
        '<div class="what">' + esc(rows[i].detail) + '</div><div class="block" style="height:' + heights[i] +
        ';background:linear-gradient(' + colors[i] + ', #0e1726)">' + (i + 1) + '</div></div>' : '<div></div>';
      $('cup-final').innerHTML = '<h2>' + esc(fin.title) + '</h2><div class="podium">' + step(1) + step(0) + step(2) + '</div>' +
        '<div class="others" style="grid-template-rows: repeat(' + Math.ceil(Math.max(rows.length - 3, 1) / 2) + ', auto)">' + rows.slice(3).map((r) => '<div><b>' + esc(r.rank) + '</b><span>' + esc(r.name) +
        '</span><span>' + esc(r.detail) + '</span></div>').join('') + '</div>';
      return;
    }
    const board = data.board;
    $('cup-body').classList.toggle('v2', !!board);
    $('cup-tables').classList.toggle('v2', !!board);
    $('cup-panel').classList.toggle('v2', !!board);
    if (board) { renderCupBoard(board, data.timeOver || ''); return; }
    const tables = data.tables || [];
    const columns = tables.length <= 1 ? 1 : tables.length <= 6 ? 2 : tables.length <= 12 ? 3 : 4;
    const box = $('cup-tables');
    box.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';
    // Texte plus petit quand les tables sont nombreuses.
    // Texte aussi grand que possible, réduit jusqu'à ce que toutes les tables tiennent.
    box.innerHTML = tables.map((t) =>
      '<div class="cup-table"><b>' + esc(data.tableLabel) + ' ' + esc(t.table) +
      (typeof t.remaining === 'number' ? '<span class="clock" data-end="' + endFor('table' + t.table, t.remaining) +
        '" data-over="' + esc(data.timeOver) + '"></span>' : '') + '</b>' +
      (t.lines || [[t.a, t.scoreA], [t.b, t.scoreB]]).map((l) =>
        '<div class="cup-line"><span>' + esc(l[0]) + '</span><span>' + esc(l[1]) + '</span></div>').join('') +
      '</div>').join('');
    // Les noms longs (équipes de quatre) passent sur deux lignes ; le texte rétrécit ensuite
    // jusqu'à ce que toutes les tables tiennent dans l'écran.
    let scale = columns <= 2 ? 1 : columns === 3 ? 0.62 : 0.5;
    box.style.setProperty('--s', scale);
    while (box.scrollHeight > box.clientHeight + 1 && scale > 0.3) {
      scale -= 0.04;
      box.style.setProperty('--s', scale);
    }
    tick();
    let panel = '';
    if ((data.waiting || []).length) {
      panel += '<h3>' + esc(data.waitingTitle) + '</h3>' + data.waiting.map((w) => '<p>' + esc(w) + '</p>').join('') + '<br>';
    }
    if ((data.side || []).length) {
      panel += '<h3>' + esc(data.sideTitle) + '</h3>' +
        data.side.map((r) => '<div class="cup-row"><span>' + esc(r.left) + '</span><span>' + esc(r.right) + '</span></div>').join('');
    }
    const panelEl = $('cup-panel');
    panelEl.innerHTML = panel;
    // Trop de lignes pour la hauteur : les dernières sont retirées, plutôt que coupées en deux.
    for (let guard = 0; panelEl.scrollHeight > panelEl.clientHeight + 1 && guard < 40; guard++) {
      const lines = panelEl.querySelectorAll('.cup-row, p');
      if (!lines.length) break;
      lines[lines.length - 1].remove();
    }
  }

  // Tournoi, version lisible de loin (organisateur d'un tournoi à 30) : les matchs un par ligne
  // (terrain, équipes, score, minuteur), sur 2 ou 3 colonnes s'il y en a beaucoup ; à droite le
  // classement en tableau (deux colonnes s'il est long) ou les derniers résultats, puis la file.
  function renderCupBoard(b, timeOver) {
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    const rgba = (hex, a) => /^#[0-9a-f]{6}$/i.test(hex || '') ? 'rgba(' + [1, 3, 5].map((i) => parseInt(hex.substr(i, 2), 16)).join(',') + ',' + a + ')' : 'rgba(255,255,255,' + a / 2 + ')';
    const members = (t) => (t && t.members) || [(t && t.label) || ''];
    // Case de l'équipe : son nom choisi en titre, ses joueurs en étiquettes.
    const team = (t, right) => '<div class="tbox' + (right ? ' r' : '') + '" style="background:' + rgba(t && t.color, 0.2) +
      ';border-color:' + rgba(t && t.color, 0.75) + '">' + (t && t.name ? '<div class="tn">' + esc(t.name) + '</div>' : '') +
      '<div class="chips"' + (t && t.name ? ' style="font-size:.78em"' : '') + '>' + members(t).map((m) => '<span>' + esc(m) + '</span>').join('') + '</div></div>';
    // Équipe sur une ligne (classement, file, résultats) : pastille de couleur et joueurs espacés.
    const teamLine = (t) => '<span class="tline"><i style="background:' + ((t && t.color) || '#888') + '"></i>' +
      (t && t.name ? [t.name] : members(t)).map((m) => '<span>' + esc(m) + '</span>').join('') + '</span>';
    // Rétrécit un élément jusqu'à ce que son contenu tienne (jamais de nom coupé).
    const fit = (el, min) => {
      let size = parseFloat(getComputedStyle(el).fontSize);
      for (let guard = 0; guard < 30 && size > min && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1); guard++) {
        size *= 0.92;
        el.style.fontSize = size + 'px';
      }
    };
    const box = $('cup-tables');
    const matches = b.matches || [];
    box.innerHTML = '<div class="mhead"><h3>' + esc(b.matchesTitle || '') + '</h3>' +
      (b.stats || []).map((s) => '<span><b>' + esc(s.value) + '</b> ' + esc(s.label) + '</span>').join('') + '</div>' +
      '<div class="mlist"></div>';
    const list = box.querySelector('.mlist');
    if (!matches.length) {
      list.style.display = 'grid';
      list.style.placeItems = 'center';
      list.innerHTML = '<div style="font-size:' + u * 4 + 'px">🏆</div>';
    } else {
      const avail = list.clientHeight || box.clientHeight * 0.85;
      const width = list.clientWidth || box.clientWidth;
      const gap = u * 0.3;
      const perColumn = Math.max(1, Math.floor(avail / (u * 1.2)));
      const columns = Math.min(3, Math.ceil(matches.length / perColumn));
      const rows = Math.ceil(matches.length / columns);
      const rowH = Math.min(u * 1.6, (avail - gap * (rows - 1)) / rows);
      const colW = (width - gap * (columns - 1)) / columns;
      const s = Math.min(rowH * 0.36, colW / 20, u * 0.55);
      const badge = Math.min(rowH * 0.62, s * 1.9);
      list.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';
      list.style.gridTemplateRows = 'repeat(' + rows + ', ' + rowH + 'px)';
      list.style.setProperty('--s', s + 'px');
      list.dataset.rowH = rowH;
      list.innerHTML = matches.map((m) => {
        const sides = m.sides || [];
        const middle = sides.length === 2
          ? team(sides[0]) + '<span class="sc">' + esc(sides[0].score) + ' – ' + esc(sides[1].score) + '</span>' + team(sides[1], true)
          : '<div class="multi">' + sides.map((p) => esc(p.label) + ' ' + esc(p.score)).join('  ·  ') + '</div>';
        return '<div class="m"><i class="tb" style="width:' + badge + 'px;height:' + badge + 'px;font-size:' + badge * 0.55 + 'px">' +
          esc(m.table) + '</i>' + middle.replace(/(<div class="tbox[^"]*") style="/g, '$1 style="max-height:' + (rowH - 6) + 'px;') +
          (typeof m.remaining === 'number' ? '<span class="clock" data-end="' + endFor('table' + m.table, m.remaining) +
            '" data-over="' + esc(timeOver) + '"></span>' : '') + '</div>';
      }).join('');
    }
    list.querySelectorAll('.tbox').forEach((el) => fit(el, 6));
    tick();

    const panel = $('cup-panel');
    const queue = b.queue || [];
    const results = b.results && (b.results.rows || []).length ? b.results : null;
    panel.innerHTML = (b.ranking ? '<section class="top"><h3>' + esc(b.ranking.title) + '</h3><div class="rk"></div></section>' :
      results ? '<section class="top"><h3>' + esc(results.title) + '</h3>' + results.rows.map((r) =>
        '<div class="res">' + teamLine(r.winner) + '<b>' + esc(r.score) + '</b>' + teamLine(r.loser) + '</div>').join('') + '</section>' : '') +
      (queue.length ? '<section class="queue"><h3>' + esc(b.queueTitle || '') + '</h3>' + queue.map((q) =>
        '<div class="qline">' + (q.sides || []).map((x) => teamLine(x)).join('<span style="margin:0 .5em;color:rgba(255,255,255,.54)">–</span>') + '</div>').join('') + '</section>' : '');
    const top = panel.querySelector('.top');
    const waiting = panel.querySelector('.queue');
    if (top) top.style.flex = '3';
    if (waiting) waiting.style.flex = top ? String(Math.min(2, 1 + Math.floor(queue.length / 4))) : '1';
    // La file : les dernières lignes retirées plutôt que coupées.
    for (const sec of [waiting, results ? top : null]) {
      if (!sec) continue;
      for (let guard = 0; sec.scrollHeight > sec.clientHeight + 1 && guard < 40; guard++) {
        const lines = sec.querySelectorAll('.qline, .res');
        if (!lines.length) break;
        lines[lines.length - 1].remove();
      }
    }
    const rk = panel.querySelector('.rk');
    if (rk) {
      const rows = b.ranking.rows || [];
      const s = u * 0.5;
      const avail = rk.clientHeight || 300;
      const oneColumn = Math.max(1, Math.floor((avail - s * 1.2) / (s * 0.95)));
      const columns = rows.length > oneColumn && rk.clientWidth > s * 18 ? 2 : 1;
      const perColumn = Math.max(1, Math.ceil(rows.length / columns));
      const rowH = Math.max(s * 0.9, Math.min(s * 1.4, (avail - s * 1.2) / perColumn));
      const f = rowH * 0.68;
      const fit = Math.floor((avail - s * 1.2) / rowH + 0.05);
      const grid = 'grid-template-columns:' + f * 2.2 + 'px minmax(0,1fr) ' + f * 1.6 + 'px ' + f * 2.9 + 'px;';
      const head = '<div class="l h" style="' + grid + 'height:' + s * 1.2 + 'px;font-size:' + f * 0.8 + 'px"><span></span><span></span><span class="w">' +
        esc(b.ranking.wins) + '</span><span class="v">' + esc(b.ranking.value) + '</span></div>';
      let html = '';
      for (let c = 0; c < columns; c++) {
        html += '<div>' + head + rows.slice(c * perColumn, c * perColumn + Math.min(perColumn, fit)).map((r) =>
          '<div class="l" style="' + grid + 'height:' + rowH + 'px;font-size:' + f + 'px"><span class="n' + (r.qualified ? ' q' : '') + '">' +
          esc(r.rank) + '</span><span class="nm" style="font-weight:700">' + teamLine(r) + '</span><span class="w">' + esc(r.wins) + '</span><span class="v">' +
          esc(r.value) + '</span></div>').join('') + '</div>';
      }
      rk.innerHTML = html;
      rk.querySelectorAll('.nm').forEach((el) => fit(el, 5));
    }
    panel.querySelectorAll('.qline, .res').forEach((el) => fit(el, 5));
  }

  let last = { kind: 'idle' };
  const show = (data) => { last = data; render(data); };
  const receive = (data) => {
    if (data && data.type === 'photo') {
      if (typeof data.key === 'string' && typeof data.data === 'string' && /^[A-Za-z0-9+/=]+$/.test(data.data)) {
        PHOTOS[data.key] = 'data:image/png;base64,' + data.data;
        render(last);
      }
    } else if (data && data.kind) {
      show(data);
    }
  };
  window.addEventListener('resize', () => render(last));

  if (/[?&]demo=final\b/.test(location.search)) {
    const names = ['Paul & Zoé', 'Rose & Jules', 'Sam & Noé', 'Nathan & Manon', 'Louis & Camille', 'Julie & Marc', 'Lucas & Chloé', 'Jo & Inès', 'Hugo & Emma', 'Léa & Tom'];
    show({
      kind: 'cup', title: 'Concours de belote du club', subtitle: 'Concours en plusieurs parties · Tournoi terminé',
      banner: 'Vainqueur : Paul & Zoé', tables: [], side: [], waiting: [],
      final: { title: 'Classement général', rows: names.map((n, i) => ({ rank: i + 1, name: n, detail: (4 - Math.floor(i / 3)) + ' V · ' + (3200 - i * 170) + ' pts' })) },
    });
    return;
  }
  if (/[?&]demo=cup\b/.test(location.search)) {
    show({
      kind: 'cup', title: 'Concours de belote du club', subtitle: 'Concours en plusieurs parties · Partie 2 / 4',
      tableLabel: 'Table', timeOver: 'Temps écoulé', waitingTitle: 'Prochains matchs', sideTitle: 'Classement', banner: null,
      tables: [
        { table: 1, a: 'Paul & Zoé', b: 'Rose & Jules', scoreA: 81, scoreB: 80, remaining: 754 },
        { table: 2, a: 'Sam & Noé', b: 'Nathan & Manon', scoreA: 0, scoreB: 0, remaining: 42 },
        { table: 3, a: 'Louis & Camille', b: 'Lucas & Chloé', scoreA: 243, scoreB: 240 },
        { table: 4, a: 'Julie & Marc', b: 'Jo & Inès', scoreA: 0, scoreB: 0 },
        { table: 5, a: 'Hugo & Emma', b: 'Léa & Tom', scoreA: 405, scoreB: 400 },
      ],
      waiting: [],
      side: [
        { left: '1. Paul & Zoé', right: '1 V · +499' }, { left: '2. Rose & Jules', right: '1 V · +483' },
        { left: '3. Sam & Noé', right: '1 V · +319' }, { left: '4. Nathan & Manon', right: '1 V · +204' },
      ],
    });
    return;
  }
  // Aperçu d'un jeu au tour par tour (Mölkky) : ?demo=molkky.
  if (/[?&]demo=molkky\b/.test(location.search)) {
    show({
      kind: 'game', title: 'Mölkky au parc', subtitle: 'Mölkky · Tour 4', color: '#16a34a', initial: 'M', pattern: 'molkky',
      footer: 'Compté avec Scoroo', dealerLabel: 'Donne', banner: null,
      info: [{ icon: 'turn', text: 'Au tour de Sam' }, { icon: 'target', text: 'Objectif 50 pts' }],
      players: [
        { i: 1, name: 'Léa', initial: 'L', color: '#e11d48', score: 38, rank: '1er', leader: true, misses: 0, delta: '+9' },
        { i: 2, name: 'Sam', initial: 'S', color: '#0b3a6e', score: 27, rank: '2e', turn: true, misses: 1, delta: 'Raté' },
        { i: 0, name: 'Arthur', initial: 'A', color: '#d97706', score: 21, rank: '3e', misses: 0, delta: '+12' },
        { i: 3, name: 'Noé', initial: 'N', color: '#7c3aed', score: 14, rank: '4e', misses: 2, delta: 'Raté' },
      ],
    });
    return;
  }
  if (/[?&]demo\b/.test(location.search) || !window.cast || !cast.framework) {
    show({
      kind: 'game', title: 'Soirée tarot', subtitle: 'Tarot · Manche 6', color: '#7c3aed', initial: 'T', pattern: 'tarot',
      footer: 'Compté avec Scoroo', dealerLabel: 'Donne', banner: null,
      info: [{ icon: 'dealer', text: 'Arthur distribue' }],
      history: {
        title: 'Donnes',
        players: [
          { initial: 'A', color: '#0b3a6e' }, { initial: 'L', color: '#e11d48' },
          { initial: 'S', color: '#16a34a' }, { initial: 'N', color: '#d97706' },
        ],
        rows: [
          { n: 1, scores: ['+50', '−50', '+50', '−50'] }, { n: 2, scores: ['−72', '+216', '−72', '−72'] },
          { n: 3, scores: ['+70', '+70', '−140', '0'] }, { n: 4, scores: ['−24', '+48', '0', '−24'] },
          { n: 5, scores: ['+120', '−40', '−40', '−40'] }, { n: 6, scores: ['−24', '+48', '−24', '0'] },
        ],
      },
      players: [
        { i: 1, name: 'Léa', initial: 'L', color: '#e11d48', score: 214, rank: '1er', leader: true, delta: '+48' },
        { i: 0, name: 'Arthur', initial: 'A', color: '#0b3a6e', score: 120, rank: '2e', dealer: true, delta: '−24' },
        { i: 2, name: 'Sam', initial: 'S', color: '#16a34a', score: -96, rank: '3e', delta: '−24' },
        { i: 3, name: 'Noé', initial: 'N', color: '#d97706', score: -238, rank: '4e' },
      ],
    });
    return;
  }

  const context = cast.framework.CastReceiverContext.getInstance();
  context.addCustomMessageListener(NS, (event) => receive(event.data));
  // Chaque téléphone qui se relie (et le premier, dès que la page est prête) reçoit « hello » :
  // il renvoie alors le tableau des scores, même si ses premiers envois sont arrivés trop tôt.
  context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (event) => {
    try { context.sendCustomMessage(NS, event.senderId, { type: 'hello' }); } catch (e) { /* téléphone déjà parti */ }
  });
  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  options.disableIdleTimeout = true; // pas de vidéo : la page ne doit pas se fermer seule
  options.skipPlayersLoad = true;
  context.start(options);
})();
</script>
</body>
</html>
