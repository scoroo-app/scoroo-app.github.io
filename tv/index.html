<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoroo TV</title>
<!--
  Page réceptrice du Chromecast (mode TV de Scoroo).
  À enregistrer dans la Google Cast Developer Console comme « Custom Receiver », avec l'adresse
  publique de cette page. L'appli envoie le tableau des scores en JSON sur le canal
  urn:x-cast:com.scoroo.tv (format : lib/tv/tv_payload.dart).
  Ouverte dans un navigateur avec ?demo, elle affiche une partie d'exemple.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --bg: #0e1726; --row: rgba(255,255,255,.06); --muted: rgba(255,255,255,.6); --gold: #ffb534; --u: min(5vh, 2.8vw); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden;
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif; }
  .screen { position: absolute; inset: 0; padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  /* Fond discret du jeu (backdrops/<jeu>.png, générés par tool/store_assets/tv_backdrops_test.dart). */
  #game { background: var(--bg) center / cover no-repeat; }
  /* Attente */
  .idle { align-items: center; justify-content: center; text-align: center; }
  .idle img { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 28%; }
  .idle h1 { font-size: calc(var(--u) * 2.6); font-weight: 900; margin: calc(var(--u) * .8) 0 calc(var(--u) * .3); letter-spacing: -.02em; }
  .idle p { font-size: calc(var(--u) * 1.05); color: var(--muted); margin: 0; }
  /* Partie */
  header { display: flex; align-items: center; gap: calc(var(--u) * .8); }
  .badge { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 30%; background: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: calc(var(--u) * 1.1); flex: none; }
  .titles { min-width: 0; }
  .title { font-size: calc(var(--u) * 1.5); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subtitle { font-size: calc(var(--u) * .85); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { flex: 1; display: flex; gap: calc(var(--u) * .8); margin: calc(var(--u) * .9) 0 calc(var(--u) * .6); min-height: 0; }
  .rows { position: relative; flex: 3; min-width: 0; }
  /* Repères (objectif, donneur, cartes) et historique des manches. */
  .info { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .4); margin-top: calc(var(--u) * .6); }
  .info:empty { display: none; }
  .pill { display: flex; align-items: center; gap: calc(var(--u) * .3); background: rgba(255,255,255,.1); border-radius: 999px;
    padding: calc(var(--u) * .2) calc(var(--u) * .55); font-weight: 700; font-size: calc(var(--u) * .7); }
  .pill i { font-style: normal; }
  .history { flex: 2; min-width: 0; background: rgba(255,255,255,.06); border-radius: calc(var(--u) * .8);
    padding: calc(var(--u) * .6); display: flex; flex-direction: column; overflow: hidden; }
  .history h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .75); }
  .hrow { display: flex; align-items: center; height: calc(var(--u) * 1.15); border-radius: calc(var(--u) * .3); flex: none; }
  .hrow.last { background: rgba(255,255,255,.08); }
  .hrow > * { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: calc(var(--u) * .62);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .hrow > :first-child { flex: none; width: calc(var(--u) * 1.4); color: rgba(255,255,255,.55); font-weight: 700; }
  .hrow .up { color: #7ee2a8; } .hrow .down { color: #ff9c9c; } .hrow .zero { color: rgba(255,255,255,.5); }
  .hhead { height: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * .2); }
  .hhead .avatar { margin: 0 auto; width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); font-size: calc(var(--u) * .5); }
  .row { position: absolute; overflow: hidden; display: flex; align-items: center; background: var(--row);
    transition: top .5s cubic-bezier(.65,0,.35,1), background .4s; }
  /* Le premier garde le même fond gris que les autres : la couronne le distingue. */
  /* Tour par tour : la ligne de celui qui joue, cerclée de blanc, avec « À jouer ». */
  .row.turn { box-shadow: inset 0 0 0 3px #fff, 0 0 24px rgba(255,255,255,.25); }
  .row.turn { background: rgba(255,255,255,.14); }
  .rank { color: var(--muted); font-weight: 800; flex: none; }
  .avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 900; flex: none; }
  .name { flex: 1; min-width: 0; font-weight: 800; line-height: 1.1; }
  .name span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { display: block; color: rgba(255,255,255,.55); font-weight: 600; }
  .name .misses { display: flex; gap: 4px; margin-top: 2px; font-style: normal; }
  .name .misses:empty { display: none; }
  .name .misses b { display: block; border-radius: 50%; }
  .crown { color: var(--gold); transition: transform .6s cubic-bezier(.34,1.56,.64,1); transform: scale(0); }
  .leader .crown { transform: scale(1); }
  .delta { font-weight: 700; }
  .delta.up { color: #7ee2a8; } .delta.down { color: #ff9c9c; }
  .score { font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
  footer { display: flex; align-items: center; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .75); color: var(--muted); font-weight: 700; }
  footer img { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 30%; }
  footer .banner { margin-left: auto; color: var(--gold); font-weight: 900; font-size: calc(var(--u) * .95); }
  /* Grand tournoi : les tables à gauche, prochains matchs et classement à droite. */
  .cup-body { flex: 1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: calc(var(--u) * .8); margin-top: calc(var(--u) * .8); min-height: 0; }
  .cup-tables { display: grid; gap: calc(var(--u) * .4); align-content: start; min-height: 0; overflow: hidden; }
  .cup-table { min-width: 0; background: var(--row); border-radius: calc(var(--u) * .7); padding: calc(var(--u) * .5 * var(--s, 1)) calc(var(--u) * .8); display: grid; gap: calc(var(--u) * .2); }
  .cup-table b { color: var(--gold); font-size: calc(var(--u) * .7); }
  .cup-line { min-width: 0; display: flex; gap: calc(var(--u) * .5); align-items: baseline; font-weight: 700; font-size: calc(var(--u) * .9 * var(--s, 1)); }
  .cup-line span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cup-line span:last-child { font-weight: 900; font-size: calc(var(--u) * 1.1 * var(--s, 1)); }
  .cup-panel { background: rgba(255,255,255,.05); border-radius: calc(var(--u) * .8); padding: calc(var(--u) * .8); overflow: hidden; }
  .cup-panel h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .8); }
  .cup-panel p { margin: 0; font-size: calc(var(--u) * .7); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
  .cup-row { display: flex; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .7); font-weight: 600; line-height: 1.6; }
  .cup-row span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cup-row span:last-child { color: var(--muted); font-weight: 800; }
  .cup-banner { margin-top: calc(var(--u) * .6); padding: calc(var(--u) * .4) calc(var(--u) * .8); border-radius: calc(var(--u) * .5);
    background: linear-gradient(90deg, #ffc94d, #ffa62b); font-weight: 900; font-size: calc(var(--u) * 1); }
  /* Fin du tournoi : podium et classement général. */
  .cup-final { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: calc(var(--u) * .6); }
  .cup-final h2 { margin: 0; text-align: center; color: var(--gold); font-size: calc(var(--u) * 1.1); }
  .podium { flex: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * .3);
    align-items: end; padding: 0 calc(var(--u) * 3); min-height: 0; }
  .step { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .step .who { font-weight: 900; font-size: calc(var(--u) * .9); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .what { color: var(--muted); font-size: calc(var(--u) * .6); margin-bottom: calc(var(--u) * .2); }
  .step .block { width: 100%; border-radius: calc(var(--u) * .5) calc(var(--u) * .5) 0 0; text-align: center;
    font-weight: 900; font-size: calc(var(--u) * 1.4); padding-top: calc(var(--u) * .2); }
  .others { flex: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; column-gap: calc(var(--u) * 1.2);
    align-content: start; margin-top: calc(var(--u) * .6); overflow: hidden; }
  .others div { display: flex; gap: calc(var(--u) * .4); font-size: calc(var(--u) * .7); line-height: 1.6; break-inside: avoid; }
  .others b { color: var(--gold); width: calc(var(--u) * 1.3); }
  .others span:nth-child(2) { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .others span:last-child { color: var(--muted); font-size: calc(var(--u) * .6); }
  /* En-tête : minuteur et QR code à droite. */
  header .titles { flex: 1; }
  .timer { background: rgba(255,255,255,.1); border-radius: calc(var(--u) * .6); padding: calc(var(--u) * .3) calc(var(--u) * .6);
    text-align: right; flex: none; }
  .timer small { display: block; font-size: calc(var(--u) * .55); color: var(--muted); font-weight: 700; }
  .timer b { font-size: calc(var(--u) * 1.1); font-weight: 900; font-variant-numeric: tabular-nums; }
  .low { color: #ff8a8a; }
  .join { display: flex; align-items: center; gap: calc(var(--u) * .4); background: rgba(255,255,255,.1);
    border-radius: calc(var(--u) * .5); padding: calc(var(--u) * .3); flex: none; }
  .join div { text-align: right; }
  .join small { display: block; font-size: calc(var(--u) * .55); color: rgba(255,255,255,.7); font-weight: 700; }
  .join b { font-size: calc(var(--u) * .8); font-weight: 900; letter-spacing: .08em; }
  .join svg { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); background: #fff; border-radius: calc(var(--u) * .2);
    padding: calc(var(--u) * .15); box-sizing: border-box; }
  /* Avatars : photo, initiale, ou deux membres d'une équipe. */
  .av { border-radius: 50%; display: grid; place-items: center; font-weight: 900; flex: none; color: #fff; }
  .team { position: relative; display: block; flex: none; }
  .team .av { position: absolute; }
  /* Sortie aux fléchettes et cases remplies d'une feuille. */
  .co { border: 2px solid var(--gold); border-radius: 999px; text-align: center; line-height: 1.1; flex: none; }
  .co:empty { display: none; }
  .co small { display: block; color: var(--gold); font-weight: 800; }
  .co b { font-weight: 900; white-space: nowrap; }
  .bar { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); margin-top: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  /* Panneau de droite : historique, courbe, Cricket (en fondu quand il change). */
  .side { flex: 2; min-width: 0; position: relative; }
  .side > div { position: absolute; inset: 0; background: rgba(255,255,255,.06); border-radius: calc(var(--u) * .8);
    padding: calc(var(--u) * .6); display: flex; flex-direction: column; overflow: hidden; transition: opacity .6s; }
  .side h3 { margin: 0 0 calc(var(--u) * .3); color: var(--gold); font-size: calc(var(--u) * .75); }
  .chart { flex: 1; min-height: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .2) calc(var(--u) * .6); margin-top: calc(var(--u) * .4);
    font-size: calc(var(--u) * .55); color: rgba(255,255,255,.7); font-weight: 700; }
  .legend span { display: flex; align-items: center; gap: calc(var(--u) * .25); }
  .legend i { width: calc(var(--u) * .7); height: calc(var(--u) * .18); border-radius: 9px; }
  .cricket { display: grid; align-items: center; justify-items: center; flex: 1; align-content: start; }
  .cricket > b { font-size: calc(var(--u) * .7); color: rgba(255,255,255,.7); font-weight: 900; }
  .mark { position: relative; display: block; }
  .mark.m1::before, .mark.m2::before, .mark.m2::after { content: ''; position: absolute; left: 12%; right: 12%; top: 50%;
    height: 14%; margin-top: -7%; border-radius: 9px; background: currentColor; transform: rotate(-45deg); }
  .mark.m2::after { transform: rotate(45deg); }
  .mark.m3 { border-radius: 50%; display: grid; place-items: center; color: #fff !important; font-weight: 900; }
  /* Manche enregistrée : carte au centre pendant trois secondes. */
  .main { position: relative; }
  .event { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.85); opacity: 0; pointer-events: none;
    min-width: calc(var(--u) * 12); padding: calc(var(--u) * .9) calc(var(--u) * 1.6); border-radius: var(--u); text-align: center;
    box-shadow: 0 0 calc(var(--u) * 1.5) rgba(0,0,0,.45); transition: opacity .3s, transform .35s cubic-bezier(.34,1.56,.64,1); z-index: 5; }
  .event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .event h2 { margin: 0; font-size: calc(var(--u) * 1.9); font-weight: 900; }
  .event p { margin: calc(var(--u) * .25) 0 0; font-size: calc(var(--u) * .95); font-weight: 800; }
  .event p.next { font-size: calc(var(--u) * .8); color: rgba(255,255,255,.7); font-weight: 600; }
  /* Fin de partie : podium, confettis, meilleur moment et le reste du classement. */
  .finale { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
  .finale h2 { margin: 0; text-align: center; color: var(--gold); font-size: calc(var(--u) * 1.4); font-weight: 900;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finale .moment { text-align: center; font-size: calc(var(--u) * .7); color: rgba(255,255,255,.7); font-weight: 600; margin-top: calc(var(--u) * .15);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finale .podium { flex: 1; padding: 0 calc(var(--u) * 2); margin-top: calc(var(--u) * .4); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .finale .step { height: 100%; animation: rise .8s cubic-bezier(.34,1.56,.64,1) both; }
  .finale .step .ring { border-radius: 50%; padding: calc(var(--u) * .12); }
  .finale .step .pts { font-weight: 900; }
  .finale .step .block { display: grid; place-items: center; padding: 0; line-height: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 3)); } to { opacity: 1; transform: none; } }
  .rest { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * .3) calc(var(--u) * .5); margin-top: calc(var(--u) * .5); }
  .rest span { display: flex; align-items: center; gap: calc(var(--u) * .3); background: rgba(255,255,255,.08); border-radius: 999px;
    padding: calc(var(--u) * .2) calc(var(--u) * .5) calc(var(--u) * .2) calc(var(--u) * .2); font-size: calc(var(--u) * .62); font-weight: 700; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cup-table .clock { float: right; font-weight: 900; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="screen idle" id="idle">
  <img src="logo.png" alt="">
  <h1>Scoroo</h1>
  <p id="waiting"></p>
</div>
<div class="screen hidden" id="game">
  <header>
    <div class="badge" id="badge"></div>
    <div class="titles"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
    <div class="timer hidden" id="timer"></div>
    <div class="join hidden" id="join"></div>
  </header>
  <div class="info" id="info"></div>
  <div class="main">
    <div class="rows" id="rows"></div>
    <div class="side hidden" id="side"></div>
    <div class="finale hidden" id="finale"></div>
    <div class="event" id="event"></div>
  </div>
  <footer><img src="logo.png" alt=""><span id="footer"></span><span class="banner" id="banner"></span></footer>
</div>
<div class="screen hidden" id="cup">
  <header>
    <div class="badge" style="color: var(--gold)">🏆</div>
    <div class="titles"><div class="title" id="cup-title"></div><div class="subtitle" id="cup-subtitle"></div></div>
  </header>
  <div class="cup-banner hidden" id="cup-banner"></div>
  <div class="cup-final hidden" id="cup-final"></div>
  <div class="cup-body" id="cup-body">
    <div class="cup-tables" id="cup-tables"></div>
    <div class="cup-panel" id="cup-panel"></div>
  </div>
</div>
<script>
(function () {
  const NS = 'urn:x-cast:com.scoroo.tv';
  const $ = (id) => document.getElementById(id);
  const rowsEl = $('rows');
  const rows = new Map(); // joueur → { el, score }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Photos des joueurs, envoyées une par une avant le tableau : clé → image (data URL).
  const PHOTOS = {};

  // Écran d'attente dans la langue de la télé, avant le premier message du téléphone.
  const WAITING = {
    fr: 'Ouvrez une partie sur le téléphone', en: 'Open a game on your phone', es: 'Abre una partida en el teléfono',
    de: 'Öffne ein Spiel auf dem Handy', it: 'Apri una partita sul telefono',
  };
  const lang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  const waitingText = WAITING[lang] || WAITING.en;

  // Photo, initiale, ou les deux membres d'une équipe (« Léa & Tom »).
  function avatarHtml(p, size) {
    const one = (m, s, extra) => {
      const photo = PHOTOS[m.photo];
      return '<span class="av" style="width:' + s + 'px;height:' + s + 'px;font-size:' + s * ((m.initial || '').length > 1 ? 0.36 : 0.46) +
        'px;background:' + (photo ? 'center / cover no-repeat url(' + photo + '), ' : '') + esc(m.color || '#555') + (extra || '') + '">' +
        (photo ? '' : esc(m.initial || '?')) + '</span>';
    };
    const members = p.members || [];
    if (members.length < 2 || PHOTOS[p.photo]) return one(p, size);
    const small = size * 0.72;
    return '<span class="team" style="width:' + size + 'px;height:' + size + 'px">' + one(members[0], small, ';left:0;top:0') +
      one(members[1], small - size * 0.06, ';right:0;bottom:0;box-shadow:0 0 0 ' + size * 0.03 + 'px var(--bg)') + '</span>';
  }

  // Décomptes (minuteur de la partie, tables du tournoi) : fin calculée à la réception du message.
  const ends = {};
  function endFor(key, remaining) {
    const known = ends[key];
    if (!known || known.remaining !== remaining) ends[key] = { remaining, at: Date.now() + remaining * 1000 };
    return ends[key].at;
  }
  function tick() {
    document.querySelectorAll('[data-end]').forEach((el) => {
      const left = Math.round((Number(el.dataset.end) - Date.now()) / 1000);
      el.textContent = left <= 0 ? el.dataset.over || '0:00' : Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      el.classList.toggle('low', left < 60);
    });
  }
  setInterval(tick, 1000);

  // QR code reçu en lignes de « 0 » et « 1 » : dessiné en SVG.
  function qrSvg(lines) {
    const n = lines.length;
    let d = '';
    lines.forEach((line, y) => { for (let x = 0; x < line.length; x++) if (line[x] === '1') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });
    return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path d="' + d + '" fill="#000"/></svg>';
  }

  let lastEvent = null;
  let eventTimer = null;
  let finaleFor = null;

  function render(data) {
    if (!data || typeof data !== 'object') return;
    const game = data.kind === 'game';
    const cup = data.kind === 'cup';
    $('idle').classList.toggle('hidden', game || cup);
    $('game').classList.toggle('hidden', !game);
    $('cup').classList.toggle('hidden', !cup);
    if (cup) { renderCup(data); return; }
    $('waiting').textContent = data.waiting || waitingText;
    if (!game) return;
    document.documentElement.style.setProperty('--game', data.color || '#0b3a6e');
    const badge = $('badge');
    badge.textContent = data.initial || '';
    badge.style.color = data.color || '#0b3a6e';
    $('game').style.backgroundImage = /^\w+$/.test(data.pattern || '') ? 'url(backdrops/' + data.pattern + '.png)' : 'none';
    $('title').textContent = data.title || '';
    $('subtitle').textContent = data.subtitle || '';
    $('footer').textContent = data.footer || '';
    // Le podium affiche déjà le vainqueur en grand.
    $('banner').textContent = data.podium ? '' : data.banner || '';
    renderHeader(data);
    renderInfo(data.podium ? [] : data.info || []);
    renderEvent(data);
    const finale = $('finale');
    finale.classList.toggle('hidden', !data.podium);
    rowsEl.classList.toggle('hidden', !!data.podium);
    if (data.podium) {
      $('side').classList.add('hidden');
      renderFinale(data);
      return;
    }
    finaleFor = null;
    const players = data.players || [];
    // Au-delà de 6 joueurs, le classement prend toute la largeur (sur deux colonnes).
    renderSide(players.length <= 6 ? data : null);

    const height = rowsEl.clientHeight || window.innerHeight * 0.7;
    const width = rowsEl.clientWidth || window.innerWidth * 0.9;
    // Beaucoup de joueurs : deux colonnes, pour que tout tienne au-dessus du bas de l'écran.
    const columns = players.length > 5 && width >= 640 ? 2 : 1;
    const perColumn = Math.ceil(players.length / columns);
    const gap = 16;
    const columnW = (width - gap * (columns - 1)) / columns;
    const rowH = Math.max(20, Math.min(height / Math.max(perColumn, 1), columnW / 4, 220));
    const seen = new Set();
    players.forEach((p, pos) => {
      seen.add(p.i);
      let row = rows.get(p.i);
      if (!row) {
        const el = document.createElement('div');
        el.className = 'row';
        el.innerHTML = '<div class="rank"></div><div class="avatar"></div>' +
          '<div class="name"><span></span><i class="misses"></i><small></small><i class="bar hidden"><i></i></i></div>' +
          '<div class="co"></div><div class="crown">♛</div><div class="delta"></div><div class="score">0</div>';
        el.style.top = (pos % perColumn) * rowH + 'px';
        rowsEl.appendChild(el);
        row = { el, score: 0 };
        rows.set(p.i, row);
      }
      const h = rowH * 0.9;
      const el = row.el;
      Object.assign(el.style, {
        top: (pos % perColumn) * rowH + 'px', left: Math.floor(pos / perColumn) * (columnW + gap) + 'px', width: columnW + 'px',
        height: h + 'px', borderRadius: h * 0.24 + 'px', padding: '0 ' + h * 0.22 + 'px',
      });
      el.classList.toggle('leader', !!p.leader);
      el.classList.toggle('turn', !!p.turn);
      const [rank, avatar, name, co, crown, delta, score] = el.children;
      // Mölkky : les ratés consécutifs, en points (rouges quand le lancer est raté).
      const misses = name.children[1];
      misses.innerHTML = typeof p.misses === 'number'
        ? [0, 1, 2].map((m) => '<b style="width:' + h * 0.13 + 'px;height:' + h * 0.13 + 'px;background:' +
            (m < p.misses ? '#ff6b6b' : 'rgba(255,255,255,.24)') + '"></b>').join('')
        : '';
      rank.textContent = p.rank || '';
      Object.assign(rank.style, { width: h * 0.75 + 'px', fontSize: h * 0.3 + 'px' });
      avatar.innerHTML = avatarHtml(p, h * 0.62);
      avatar.style.marginRight = h * 0.2 + 'px';
      name.firstChild.textContent = p.name || '';
      name.firstChild.style.fontSize = h * 0.36 + 'px';
      // Sortie aux fléchettes : en pastille si la ligne est large, sinon sous le nom.
      const chip = p.checkout && columnW >= h * 6;
      name.children[2].textContent = [p.dealer ? data.dealerLabel : null, p.note,
        p.checkout && !chip ? data.checkoutLabel + ' ' + p.checkout : null].filter(Boolean).join(' · ');
      name.children[2].style.fontSize = h * 0.18 + 'px';
      // Feuilles : les cases remplies, en barre à la couleur du joueur.
      const bar = name.children[3];
      bar.classList.toggle('hidden', typeof p.progress !== 'number');
      Object.assign(bar.firstChild.style, { width: Math.round((p.progress || 0) * 100) + '%', background: p.color || '#fff' });
      bar.style.marginRight = h * 0.4 + 'px';
      co.innerHTML = chip ? '<small>' + esc(data.checkoutLabel) + '</small><b>' + esc(p.checkout) + '</b>' : '';
      Object.assign(co.style, { fontSize: h * 0.2 + 'px', padding: h * 0.05 + 'px ' + h * 0.16 + 'px', marginRight: h * 0.2 + 'px' });
      if (co.firstChild) co.firstChild.style.fontSize = h * 0.13 + 'px';
      Object.assign(crown.style, { fontSize: h * 0.38 + 'px', margin: '0 ' + h * 0.15 + 'px' });
      delta.textContent = p.delta || '';
      delta.className = 'delta' + (p.delta ? (p.delta.startsWith('+') ? ' up' : ' down') : '');
      Object.assign(delta.style, { fontSize: h * 0.24 + 'px', marginRight: p.delta ? h * 0.2 + 'px' : '0' });
      score.style.fontSize = h * 0.52 + 'px';
      animate(row, score, Number(p.score) || 0);
    });
    for (const [i, row] of rows) {
      if (!seen.has(i)) { row.el.remove(); rows.delete(i); }
    }
  }

  // En-tête : minuteur de la partie et QR code d'une partie partagée.
  function renderHeader(data) {
    const timer = $('timer');
    timer.classList.toggle('hidden', !data.timer);
    if (data.timer) {
      timer.innerHTML = '<small>' + esc(data.timer.label) + '</small><b data-end="' + endFor('game', data.timer.remaining) +
        '" data-over="' + esc(data.timer.over) + '"></b>';
    }
    const join = $('join');
    const showJoin = data.join && (data.join.qr || []).length && window.innerWidth > window.innerHeight;
    join.classList.toggle('hidden', !showJoin);
    if (showJoin) join.innerHTML = '<div><small>' + esc(data.join.text) + '</small><b>' + esc(data.join.code) + '</b></div>' + qrSvg(data.join.qr);
    tick();
  }

  // Pastilles sous le titre : objectif, donneur, cartes de la manche.
  const ICONS = { target: '🏁', dealer: '✋', start: '▶️', cards: '🃏' };
  function renderInfo(info) {
    // « Au tour de … » se lit seul, sans pictogramme.
    $('info').innerHTML = info.map((i) => '<span class="pill">' + (i.icon === 'turn' ? '' : '<i>' + (ICONS[i.icon] || 'ℹ️') + '</i>') +
      esc(i.text) + '</span>').join('');
  }

  // Manche enregistrée : une carte au centre pendant trois secondes (rien au premier affichage).
  function renderEvent(data) {
    const e = data.event;
    const id = e && typeof e.id === 'number' ? e.id : null;
    const el = $('event');
    if (id !== null && lastEvent !== null && id > lastEvent) {
      el.style.background = 'linear-gradient(135deg, color-mix(in srgb, ' + (data.color || '#0b3a6e') + ' 88%, #fff), color-mix(in srgb, ' +
        (data.color || '#0b3a6e') + ' 55%, #0e1726))';
      el.innerHTML = '<h2>' + esc(e.title) + '</h2>' + (e.best ? '<p>⭐ ' + esc(e.best) + '</p>' : '') +
        (e.next ? '<p class="next">' + esc(e.next) + '</p>' : '');
      el.classList.add('show');
      clearTimeout(eventTimer);
      eventTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }
    if (data.id !== render.gameId) { lastEvent = null; render.gameId = data.id; }
    lastEvent = id;
  }

  // Panneau de droite : la grille du Cricket, ou l'historique et la courbe en alternance.
  let sideIndex = 0;
  let sideData = null;
  setInterval(() => { sideIndex++; if (sideData) renderSide(sideData, true); }, 15000);
  function renderSide(data, rotating) {
    const el = $('side');
    const wide = window.innerWidth > window.innerHeight * 1.25;
    const panels = !data ? [] : data.cricket ? ['cricket'] : [data.history && (data.history.rows || []).length ? 'history' : null,
      data.chart ? 'chart' : null].filter(Boolean);
    sideData = data;
    if (!panels.length || !wide) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.classList.remove('hidden');
    const kind = panels[sideIndex % panels.length];
    const box = document.createElement('div');
    el.querySelectorAll(':scope > div').forEach((old) => {
      if (rotating && old.dataset.kind !== kind) { old.style.opacity = '0'; setTimeout(() => old.remove(), 600); } else old.remove();
    });
    box.dataset.kind = kind;
    el.appendChild(box);
    if (kind === 'history') fillHistory(box, data.history);
    if (kind === 'chart') fillChart(box, data.chart);
    if (kind === 'cricket') fillCricket(box, data.cricket);
    if (rotating) { box.style.opacity = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { box.style.opacity = '1'; })); }
  }

  // Historique des manches : les plus récentes en bas.
  function fillHistory(el, h) {
    const players = h.players || [];
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    const cls = (s) => (s.startsWith('+') ? 'up' : s.startsWith('−') ? 'down' : 'zero');
    el.innerHTML = '<h3>' + esc(h.title) + '</h3>' +
      '<div class="hrow hhead"><span></span>' + players.map((p) => '<span>' + avatarHtml(p, u * 1.1) + '</span>').join('') + '</div>' +
      (h.rows || []).map((r, k, all) => '<div class="hrow' + (k === all.length - 1 ? ' last' : '') + '"><span>' + esc(r.n) + '</span>' +
        (r.scores || []).map((s) => '<span class="' + cls(String(s)) + '">' + esc(s) + '</span>').join('') + '</div>').join('');
    el.querySelectorAll('.hhead > span > *').forEach((a) => { a.style.margin = '0 auto'; });
    // Ce qui dépasse : on retire les manches les plus anciennes.
    const data = el.querySelectorAll('.hrow:not(.hhead)');
    for (let k = 0; el.scrollHeight > el.clientHeight + 1 && k < data.length - 1; k++) data[k].remove();
  }

  // Courbe des scores : une ligne par joueur, avec un point au bout.
  function fillChart(el, chart) {
    el.innerHTML = '<h3>' + esc(chart.title) + '</h3><svg class="chart"></svg><div class="legend">' +
      (chart.series || []).map((s) => '<span><i style="background:' + esc(s.color) + '"></i>' + esc(s.name) + '</span>').join('') + '</div>';
    const svg = el.querySelector('svg');
    const w = svg.clientWidth || 400, h = svg.clientHeight || 200;
    const all = (chart.series || []).flatMap((s) => s.points || []);
    if (!all.length) return;
    let lo = Math.min(0, ...all), hi = Math.max(...all);
    if (hi - lo < 1) hi = lo + 1;
    const count = Math.max(...chart.series.map((s) => (s.points || []).length));
    const pad = 8;
    const x = (k) => pad + (count <= 1 ? 0 : (w - pad * 2) * k / (count - 1));
    const y = (v) => pad + (h - pad * 2) - (v - lo) / (hi - lo) * (h - pad * 2);
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.innerHTML = '<line x1="0" x2="' + w + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="rgba(255,255,255,.24)"/>' +
      chart.series.map((s) => {
        const pts = s.points || [];
        if (!pts.length) return '';
        const last = pts.length - 1;
        return '<polyline fill="none" stroke="' + esc(s.color) + '" stroke-width="' + Math.max(2, u * 0.12) +
          '" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map((v, k) => x(k) + ',' + y(v)).join(' ') + '"/>' +
          '<circle cx="' + x(last) + '" cy="' + y(pts[last]) + '" r="' + u * 0.22 + '" fill="' + esc(s.color) + '" stroke="#fff" stroke-width="' +
          Math.max(1.5, u * 0.05) + '"/>';
      }).join('');
  }

  // Cricket : numéros en colonnes, une ligne par joueur ; « / », « X », puis numéro fermé.
  function fillCricket(el, c) {
    const targets = c.targets || [];
    const list = c.rows || [];
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    el.innerHTML = '<h3>' + esc(c.title) + '</h3><div class="cricket"></div>';
    const grid = el.querySelector('.cricket');
    // Le titre, puis la ligne des numéros et une ligne par joueur, toutes de la même hauteur.
    const rowH = Math.min(u * 1.6, (el.clientHeight - u * 2.4) / (list.length + 1));
    const mark = rowH * 0.62;
    grid.style.gridTemplateColumns = rowH * 1.1 + 'px repeat(' + targets.length + ', minmax(0, 1fr))';
    grid.style.gridAutoRows = rowH + 'px';
    grid.innerHTML = '<span></span>' + targets.map((t) => '<b>' + esc(t) + '</b>').join('') + list.map((r) =>
      '<span style="justify-self:start">' + avatarHtml(r, rowH * 0.8) + '</span>' + (r.marks || []).slice(0, targets.length).map((m) =>
        '<span class="mark m' + Math.min(3, m) + '" style="width:' + mark + 'px;height:' + mark + 'px;color:' + esc(r.color) +
        (m >= 3 ? ';background:' + esc(r.color) + ';font-size:' + mark * 0.6 + 'px">✕' : '">') + '</span>').join('')).join('');
  }

  // Fin de partie : podium des trois premiers, confettis, meilleur moment, puis les autres.
  function renderFinale(data) {
    const f = data.podium;
    const el = $('finale');
    const places = f.places || [];
    const shown = new Set(places.map((p) => p.i));
    const rest = (data.players || []).filter((p) => !shown.has(p.i)).slice(0, 8);
    const u = Math.min(window.innerHeight * 0.05, window.innerWidth * 0.028);
    const colors = ['#ffb534', '#b8c2cf', '#d9935e'];
    el.innerHTML = '<h2>' + esc(f.title) + '</h2>' + (f.highlight ? '<div class="moment">' + esc(f.highlight) + '</div>' : '') +
      '<div class="podium"></div>' + (rest.length ? '<div class="rest">' + rest.map((p) => '<span>' + avatarHtml(p, u * 1.1) +
      esc(p.rank) + '  ' + esc(p.name) + '  ·  ' + esc(p.score) + '</span>').join('') + '</div>' : '') + '<canvas id="confetti"></canvas>';
    const podium = el.querySelector('.podium');
    const H = podium.clientHeight || window.innerHeight * 0.5;
    // Même échelle pour les trois marches, calculée sur le premier (le plus haut) : le vainqueur
    // reste le plus grand, et tout tient au-dessus de sa marche.
    const head = (k) => u * (1.3 * k + 3.64 * k + 0.25 + (1.05 + 1.3) * 1.3 * Math.max(k, 0.6) + 0.2);
    let k = 1;
    while (k > 0.3 && head(k) > H * 0.7) k -= 0.05;
    const t = Math.max(k, 0.6);
    const step = (i) => {
      const p = places[i];
      if (!p) return '<div></div>';
      const first = i === 0;
      const block = H * [0.3, 0.21, 0.14][i];
      return '<div class="step" style="animation-delay:' + (2 - i) * 0.25 + 's">' + (first ? '<div style="font-size:' + u * 1.3 * k + 'px">🏆</div>' : '') +
        '<span class="ring" style="background:' + colors[i] + '">' + avatarHtml(p, u * (first ? 3.4 : 2.6) * k) + '</span>' +
        '<div class="who" style="font-size:' + u * (first ? 1.05 : 0.85) * t + 'px;margin-top:' + u * 0.25 + 'px">' + esc(p.name) + '</div>' +
        '<div class="pts" style="font-size:' + u * (first ? 1.3 : 1.0) * t + 'px;color:' + colors[i] + ';margin-bottom:' + u * 0.2 + 'px">' + esc(p.score) + '</div>' +
        '<div class="block" style="height:' + block + 'px;font-size:' + Math.min(u * 1.6, block * 0.7) + 'px;background:linear-gradient(' +
        colors[i] + ', color-mix(in srgb, ' + colors[i] + ' 40%, #0e1726))">' + esc(p.rank || i + 1) + '</div></div>';
    };
    podium.innerHTML = step(1) + step(0) + step(2);
    if (finaleFor !== data.id) { finaleFor = data.id; confetti(el.querySelector('#confetti')); }
  }

  // Confettis qui tombent pendant six secondes.
  function confetti(canvas) {
    if (!canvas || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    const colors = ['#ffb534', '#ff6b6b', '#7ee2a8', '#6cb4ff', '#c18bff', '#ffffff'];
    const bits = Array.from({ length: 90 }, (_, k) => ({ x: Math.random() * w, delay: Math.random() * 0.35, speed: 0.8 + Math.random() * 0.7,
      size: 5 + Math.random() * 6, color: colors[k % colors.length], k }));
    const start = performance.now();
    const frame = (now) => {
      const t = (now - start) / 6000;
      ctx.clearRect(0, 0, w, h);
      if (t >= 1 || !canvas.isConnected) return;
      const fade = t > 0.8 ? (1 - t) / 0.2 : 1;
      for (const b of bits) {
        const p = Math.max(0, Math.min(1, (t - b.delay) / (1 - b.delay))) * b.speed;
        if (p <= 0) continue;
        ctx.save();
        ctx.translate(b.x + Math.sin(p * 9 + b.k) * 18, -20 + p * (h + 40));
        ctx.rotate(p * 12 + b.k);
        ctx.globalAlpha = fade;
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.size / 2, -b.size * 0.22, b.size, b.size * 0.45);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // Les scores défilent jusqu'à leur nouvelle valeur, comme dans l'appli.
  function animate(row, el, target) {
    const from = row.score;
    row.score = target;
    if (from === target) { el.textContent = target; return; }
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 550);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (target - from) * eased);
      if (t < 1 && row.score === target) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // Grand tournoi : une carte par table, puis les prochains matchs et le classement.
  function renderCup(data) {
    $('cup-title').textContent = data.title || '';
    $('cup-subtitle').textContent = data.subtitle || '';
    const banner = $('cup-banner');
    banner.textContent = data.banner ? '🏆 ' + data.banner : '';
    banner.classList.toggle('hidden', !data.banner);
    const fin = data.final;
    $('cup-final').classList.toggle('hidden', !fin);
    $('cup-body').classList.toggle('hidden', !!fin);
    if (fin) {
      banner.classList.add('hidden');
      const rows = fin.rows || [];
      const colors = ['#ffb534', '#a7b1be', '#cd8b5a'];
      const heights = ['calc(var(--u) * 4.4)', 'calc(var(--u) * 3.2)', 'calc(var(--u) * 2.3)'];
      const step = (i) => rows[i] ? '<div class="step"><div class="who">' + (i === 0 ? '🏆 ' : '') + esc(rows[i].name) + '</div>' +
        '<div class="what">' + esc(rows[i].detail) + '</div><div class="block" style="height:' + heights[i] +
        ';background:linear-gradient(' + colors[i] + ', #0e1726)">' + (i + 1) + '</div></div>' : '<div></div>';
      $('cup-final').innerHTML = '<h2>' + esc(fin.title) + '</h2><div class="podium">' + step(1) + step(0) + step(2) + '</div>' +
        '<div class="others" style="grid-template-rows: repeat(' + Math.ceil(Math.max(rows.length - 3, 1) / 2) + ', auto)">' + rows.slice(3).map((r) => '<div><b>' + esc(r.rank) + '</b><span>' + esc(r.name) +
        '</span><span>' + esc(r.detail) + '</span></div>').join('') + '</div>';
      return;
    }
    const tables = data.tables || [];
    const columns = tables.length <= 1 ? 1 : tables.length <= 6 ? 2 : tables.length <= 12 ? 3 : 4;
    const box = $('cup-tables');
    box.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';
    // Texte plus petit quand les tables sont nombreuses.
    // Texte aussi grand que possible, réduit jusqu'à ce que toutes les tables tiennent.
    let scale = columns <= 2 ? 1 : columns === 3 ? 0.62 : 0.5;
    box.style.setProperty('--s', scale);
    while (box.scrollHeight > box.clientHeight + 1 && scale > 0.35) {
      scale -= 0.05;
      box.style.setProperty('--s', scale);
    }
    box.innerHTML = tables.map((t) =>
      '<div class="cup-table"><b>' + esc(data.tableLabel) + ' ' + esc(t.table) +
      (typeof t.remaining === 'number' ? '<span class="clock" data-end="' + endFor('table' + t.table, t.remaining) +
        '" data-over="' + esc(data.timeOver) + '"></span>' : '') + '</b>' +
      (t.lines || [[t.a, t.scoreA], [t.b, t.scoreB]]).map((l) =>
        '<div class="cup-line"><span>' + esc(l[0]) + '</span><span>' + esc(l[1]) + '</span></div>').join('') +
      '</div>').join('');
    tick();
    let panel = '';
    if ((data.waiting || []).length) {
      panel += '<h3>' + esc(data.waitingTitle) + '</h3>' + data.waiting.map((w) => '<p>' + esc(w) + '</p>').join('') + '<br>';
    }
    if ((data.side || []).length) {
      panel += '<h3>' + esc(data.sideTitle) + '</h3>' +
        data.side.map((r) => '<div class="cup-row"><span>' + esc(r.left) + '</span><span>' + esc(r.right) + '</span></div>').join('');
    }
    $('cup-panel').innerHTML = panel;
  }

  let last = { kind: 'idle' };
  const show = (data) => { last = data; render(data); };
  const receive = (data) => {
    if (data && data.type === 'photo') {
      if (typeof data.key === 'string' && typeof data.data === 'string' && /^[A-Za-z0-9+/=]+$/.test(data.data)) {
        PHOTOS[data.key] = 'data:image/png;base64,' + data.data;
        render(last);
      }
    } else if (data && data.kind) {
      show(data);
    }
  };
  window.addEventListener('resize', () => render(last));

  if (/[?&]demo=final\b/.test(location.search)) {
    const names = ['Paul & Zoé', 'Rose & Jules', 'Sam & Noé', 'Nathan & Manon', 'Louis & Camille', 'Julie & Marc', 'Lucas & Chloé', 'Jo & Inès', 'Hugo & Emma', 'Léa & Tom'];
    show({
      kind: 'cup', title: 'Concours de belote du club', subtitle: 'Concours en plusieurs parties · Tournoi terminé',
      banner: 'Vainqueur : Paul & Zoé', tables: [], side: [], waiting: [],
      final: { title: 'Classement général', rows: names.map((n, i) => ({ rank: i + 1, name: n, detail: (4 - Math.floor(i / 3)) + ' V · ' + (3200 - i * 170) + ' pts' })) },
    });
    return;
  }
  if (/[?&]demo=cup\b/.test(location.search)) {
    show({
      kind: 'cup', title: 'Concours de belote du club', subtitle: 'Concours en plusieurs parties · Partie 2 / 4',
      tableLabel: 'Table', timeOver: 'Temps écoulé', waitingTitle: 'Prochains matchs', sideTitle: 'Classement', banner: null,
      tables: [
        { table: 1, a: 'Paul & Zoé', b: 'Rose & Jules', scoreA: 81, scoreB: 80, remaining: 754 },

  // il renvoie alors le tableau des scores, même si ses premiers envois sont arrivés trop tôt.
  context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (event) => {
    try { context.sendCustomMessage(NS, event.senderId, { type: 'hello' }); } catch (e) { /* téléphone déjà parti */ }
  });
  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
